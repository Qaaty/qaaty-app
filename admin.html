<style>

  :root{
    --mint-1:#DAE1FF;
    --mint-2:#A9B4F5;
    --teal-3:#7B85E8;
    --teal-deep:#4D48C4;
    --teal-dark:#2A2470;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(255,255,255,0.7);
    --ink:#2A2470;
    --ink-muted:#6E68A8;
    --coral:#E8598F;
    --coral-soft:#FBDCE9;
    --amber:#C97A2E;
    --amber-soft:#FBE8D3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    background:linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%);
    position:relative;
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }

  .bubble{
    position:fixed; border-radius:50%;
    background:rgba(255,255,255,0.28);
    filter:blur(1px); pointer-events:none; z-index:0;
  }
  .b1{ width:180px; height:180px; top:-60px; left:-50px; }
  .b2{ width:90px; height:90px; top:120px; right:20px; background:rgba(255,255,255,.35); }
  .b3{ width:260px; height:260px; bottom:60px; right:-100px; background:rgba(255,255,255,.18); }

  /* ---------- Admin login ---------- */
  .login-screen{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:center;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:24px;
  }
  .login-screen.hidden{ display:none; }
  .login-card{ width:100%; max-width:380px; text-align:center; position:relative; z-index:1; }
  .login-avatar{
    width:76px; height:76px; margin:0 auto 18px; border-radius:50%;
    background:var(--glass-strong); border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem; color:var(--teal-deep); box-shadow:0 14px 32px rgba(18,61,51,.18);
  }
  .login-card h1{ font-size:1.35rem; font-weight:800; color:var(--teal-dark); }
  .login-card p{ font-size:.82rem; color:var(--ink-muted); margin-top:4px; margin-bottom:26px; }

  .login-form{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:26px; padding:26px 22px;
    box-shadow:0 16px 34px rgba(18,61,51,.12);
    text-align:right;
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.78rem; font-weight:700; color:var(--ink-muted); margin-bottom:7px; }
  .field input, .field select{
    width:100%; font-family:'Tajawal', sans-serif; font-size:16px; color:var(--ink);
    background:rgba(255,255,255,0.75); border:1px solid var(--glass-border);
    border-radius:14px; padding:13px 14px; outline:none;
  }
  .field input:focus{ border-color:var(--teal-deep); background:#fff; }
  .lock-day-select{
    width:100%; font-family:'Tajawal', sans-serif; font-size:16px; font-weight:700; color:var(--ink);
    background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%234D48C4" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>') no-repeat left 14px center;
    border:1.5px solid var(--glass-border); border-radius:14px;
    padding:13px 40px 13px 14px; outline:none; appearance:none; -webkit-appearance:none;
    cursor:pointer; margin-top:8px;
  }
  .lock-day-select:focus{ border-color:var(--teal-deep); }
  .login-error{
    display:none; background:var(--coral-soft); color:var(--coral);
    font-size:.8rem; font-weight:700; padding:10px 14px; border-radius:12px; margin-bottom:16px;
  }
  .login-error.show{ display:block; }

  .login-submit{
    width:100%; margin-top:6px;
    background:linear-gradient(150deg, var(--teal-3), var(--teal-deep));
    color:#fff; border:none; border-radius:16px; padding:15px;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.92rem; cursor:pointer;
    box-shadow:0 14px 30px rgba(77,72,196,.35);
  }

  /* ---------- Admin panel ---------- */
  .admin-panel{ display:none; min-height:100vh; position:relative; z-index:1; }
  .admin-panel.open{ display:block; }

  .admin-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:24px 20px 12px; max-width:640px; margin:0 auto;
  }
  .admin-topbar h2{ font-size:1.2rem; font-weight:800; color:var(--teal-dark); }
  .admin-topbar button{
    border:none; border-radius:20px; padding:8px 18px;
    background:var(--glass-strong); color:var(--teal-deep);
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:.8rem; cursor:pointer;
  }
  .admin-body{ padding:0 20px 40px; max-width:640px; margin:0 auto; }

  .admin-tabs{
    display:flex; gap:8px; margin-bottom:18px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:5px;
  }
  .admin-tabs button{
    flex:1; border:none; background:transparent;
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:.85rem;
    color:var(--ink-muted); padding:10px; border-radius:12px; cursor:pointer;
  }
  .admin-tabs button.active{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }

  .lang-switch{ display:flex; gap:6px; }
  .lang-switch button{
    border:1px solid var(--glass-border); background:var(--glass);
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.72rem;
    color:var(--ink-muted); padding:6px 12px; border-radius:20px; cursor:pointer;
  }
  .lang-switch button.active{ background:var(--teal-deep); color:#fff; border-color:var(--teal-deep); }
  .login-lang-switch{ display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .login-lang-switch button{
    border:1px solid var(--glass-border); background:var(--glass-strong);
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.78rem;
    color:var(--ink-muted); padding:8px 18px; border-radius:20px; cursor:pointer;
  }
  .login-lang-switch button.active{ background:var(--teal-deep); color:#fff; border-color:var(--teal-deep); }

  .admin-tab-panel{ display:none; }
  .admin-tab-panel.active{ display:block; }

  .card{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:20px; padding:16px 18px;
    box-shadow:0 14px 32px rgba(18,61,51,.1);
    margin-bottom:14px;
  }
  .card .label{ font-size:.72rem; color:var(--ink-muted); font-weight:700; letter-spacing:.3px; margin-bottom:8px; }
  .card .value{ font-size:1.2rem; font-weight:800; color:var(--teal-dark); }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-grid .stat{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:16px;
    padding:12px 8px; text-align:center;
  }
  .stat-grid .stat .s-label{ font-size:.62rem; color:var(--ink-muted); font-weight:700; margin-bottom:6px; }
  .stat-grid .stat .s-value{ font-size:1rem; font-weight:800; }

  .search-row{ display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:14px; padding:10px 14px;
  }
  .search-box svg{ width:15px; height:15px; color:var(--ink-muted); flex-shrink:0; }
  .search-box input{
    border:none; background:transparent; outline:none;
    font-family:'Tajawal', sans-serif; font-size:16px; color:var(--ink); width:100%;
  }
  .icon-btn{
    width:40px; height:40px; flex-shrink:0; border-radius:14px;
    background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink-muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:.8rem;
  }

  .bulk-row{ display:flex; gap:8px; margin-bottom:12px; }
  .bulk-row button{
    border:none; border-radius:12px; padding:10px 0; font-family:'Tajawal', sans-serif;
    font-weight:800; font-size:.78rem; cursor:pointer;
  }
  .bulk-select-all{ flex:1; background:var(--glass); color:var(--ink-muted); border:1px solid var(--glass-border) !important; }
  .bulk-mark-paid{ flex:2; background:rgba(200,200,200,.4); color:var(--ink-muted); }
  .bulk-mark-paid.enabled{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }

  .progress-card .p-top{ display:flex; justify-content:space-between; margin-bottom:8px; font-size:.78rem; font-weight:700; }
  .progress-bar{ background:rgba(110,104,168,.15); border-radius:20px; height:10px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--teal-3), var(--teal-deep)); border-radius:20px; }
  .progress-caption{ text-align:center; margin-top:8px; font-size:.74rem; color:var(--ink-muted); }

  .account-row{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:20px;
    padding:14px 16px; margin-bottom:10px;
    box-shadow:0 12px 26px rgba(18,61,51,.1);
    display:flex; align-items:center; gap:10px;
  }
  .account-row.selectable{ cursor:pointer; }
  .ar-checkbox{
    width:20px; height:20px; border-radius:6px; flex-shrink:0;
    border:2px solid var(--glass-border); background:transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .ar-checkbox.checked{ background:var(--teal-deep); border-color:var(--teal-deep); color:#fff; font-size:.7rem; }
  .ar-main{ flex:1; min-width:0; }
  .ar-name{ font-size:.9rem; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .ar-name .lock-tag{ font-size:.62rem; background:var(--coral-soft); color:var(--coral); padding:1px 6px; border-radius:6px; }
  .ar-meta{ font-size:.74rem; color:var(--ink-muted); margin-top:3px; line-height:1.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ar-pay-line{ font-size:.74rem; font-weight:700; margin-top:4px; }
  .ar-pay-line.paid{ color:#1E7A63; }
  .ar-pay-line.unpaid{ color:var(--coral); }

  .account-status{ font-size:.68rem; font-weight:700; padding:4px 11px; border-radius:14px; flex-shrink:0; white-space:nowrap; }
  .account-status.pending{ background:var(--amber-soft); color:var(--amber); }
  .account-status.active{ background:rgba(30,122,99,.15); color:#1E7A63; }
  .account-status.disabled{ background:rgba(110,104,168,.15); color:var(--ink-muted); }

  .ar-actions{ display:flex; gap:6px; flex-shrink:0; }
  .ar-actions button{
    border:none; border-radius:10px; padding:8px 10px; cursor:pointer; font-size:.9rem;
  }
  .ar-toggle-on{ background:rgba(30,122,99,.15); color:#1E7A63; }
  .ar-toggle-off{ background:var(--coral-soft); color:var(--coral); }
  .ar-reset{ background:rgba(77,72,196,.12); color:var(--teal-deep); }
  .ar-delete{ background:var(--coral-soft); color:var(--coral); }
  .ar-pay-btn{
    border:none; border-radius:10px; padding:9px 14px; font-family:'Tajawal', sans-serif;
    font-weight:800; font-size:.76rem; cursor:pointer; white-space:nowrap;
  }
  .ar-pay-btn.is-paid{ background:rgba(30,122,99,.15); color:#1E7A63; }
  .ar-pay-btn.is-unpaid{ background:var(--coral-soft); color:var(--coral); }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; }
  .month-nav button{
    width:34px; height:34px; border-radius:50%; border:none;
    background:var(--glass-strong); color:var(--teal-deep); font-size:1.1rem; cursor:pointer;
  }
  .month-nav .m-label{ font-weight:800; color:var(--ink); }

  .price-row{ display:flex; justify-content:space-between; align-items:center; }
  .price-row .p-value{ font-size:1.3rem; font-weight:800; color:var(--teal-deep); }
  .price-row .p-value span{ font-size:.78rem; color:var(--ink-muted); font-weight:600; }
  .edit-price-btn{
    background:rgba(77,72,196,.12); color:var(--teal-deep); border:none; border-radius:10px;
    padding:7px 14px; font-size:.76rem; font-weight:800; cursor:pointer;
  }
  .price-edit-row{ display:flex; gap:8px; }
  .price-edit-row input{ flex:1; }
  .price-edit-row button{
    border:none; border-radius:10px; padding:0 14px; font-weight:800; cursor:pointer;
  }

  .autolock-card.on{ border-color:var(--amber); }
  .autolock-label{ display:flex; align-items:center; gap:6px; margin-bottom:10px; font-size:.72rem; font-weight:800; letter-spacing:.3px; }
  .autolock-label.on{ color:var(--amber); }
  .autolock-label.off{ color:var(--ink-muted); }

  .empty-state{ text-align:center; padding:36px 10px; color:var(--ink-muted); font-size:.84rem; }

  /* ---------- Confirm modal ---------- */
  .confirm-overlay{
    position:fixed; inset:0; z-index:50; background:rgba(30,27,58,.4);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .confirm-overlay.open{ display:flex; }
  .confirm-box{
    background:#fff; border-radius:22px; padding:26px 22px; width:100%; max-width:340px; text-align:center;
    box-shadow:0 20px 50px rgba(18,61,51,.25);
  }
  .confirm-box .c-icon{ font-size:1.8rem; margin-bottom:10px; }
  .confirm-box .c-title{ font-size:1rem; font-weight:800; color:var(--ink); margin-bottom:4px; }
  .confirm-box .c-sub{ font-size:.8rem; color:var(--ink-muted); margin-bottom:16px; }
  .confirm-box .c-msg{ font-size:.8rem; font-weight:700; margin-bottom:12px; }
  .confirm-box .c-msg.ok{ color:#1E7A63; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{
    flex:1; border:none; border-radius:12px; padding:12px; font-family:'Tajawal', sans-serif;
    font-weight:800; font-size:.84rem; cursor:pointer;
  }
  .confirm-cancel{ background:rgba(110,104,168,.12); color:var(--ink-muted); }
  .confirm-ok{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }
  .confirm-ok.danger{ background:var(--coral); }


.loading-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%); }
.spinner{ width:40px; height:40px; border:3px solid rgba(255,255,255,.5); border-top-color:var(--teal-deep); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

</style>

function fmtM(n){
  if(n < 1000000) return n.toLocaleString('en-US');
  const m = Math.floor(n / 1000000);
  const d = Math.floor((n % 1000000) / 100000);
  return d > 0 ? `${m},${d}M` : `${m}M`;
}
function formatPhone(p){ return (p||'').replace(/(\d{2})(?=\d)/g, '$1 ').trim(); }

// ── ACCOUNTS TAB ─────────────────────────────────────────────────────────
function AccountsTab({ t }){
  const [accounts, setAccounts] = useState([]);
  const [search, setSearch] = useState('');
  const [confirmModal, setConfirmModal] = useState(null); // {type, account}

  useEffect(() => {
    const unsub = db.collection('users').onSnapshot(snap => {
      setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  const filtered = accounts.filter(a =>
    !search || (a.hallName||'').toLowerCase().includes(search.toLowerCase()) || (a.email||'').toLowerCase().includes(search.toLowerCase())
  );
  const total = accounts.length;
  const active = accounts.filter(a => a.active).length;
  const pending = accounts.filter(a => !a.active).length;

  const doToggle = async (acc) => {
    await db.collection('users').doc(acc.id).update({ active: !acc.active });
    setConfirmModal(null);
  };
  const doDelete = async (acc) => {
    await db.collection('users').doc(acc.id).delete();
    setConfirmModal(null);
  };
  const doResetPassword = async (acc) => {
    try {
      await auth.sendPasswordResetEmail(acc.email);
      setConfirmModal({ type:'reset-done', account: acc });
    } catch(e) {
      alert(t.errorGenericPrefix + ': ' + e.message);
    }
  };

  return (
    <div>
      <div className="stat-grid">
        <div className="stat"><div className="s-label">{t.statAll}</div><div className="s-value" style={{color:'var(--ink)'}}>{total}</div></div>
        <div className="stat"><div className="s-label">{t.statActive}</div><div className="s-value" style={{color:'#1E7A63'}}>{active}</div></div>
        <div className="stat"><div className="s-label">{t.statPending}</div><div className="s-value" style={{color:'var(--amber)'}}>{pending}</div></div>
      </div>
      <div className="search-row">
        <div className="search-box">
          <input placeholder={t.searchAccountsPlaceholder} value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
      </div>
      {filtered.map(acc => (
        <div className="account-row" key={acc.id}>
          <div className="ar-main">
            <div className="ar-name">{acc.hallName}</div>
            <div className="ar-meta">{acc.email} · {formatPhone(acc.phone)}</div>
          </div>
          <span className={`account-status ${acc.active?'active':'pending'}`}>{acc.active?t.statusActive:t.statusPending}</span>
          <div className="ar-actions">
            <button className={acc.active?'ar-toggle-on':'ar-toggle-off'} onClick={()=>doToggle(acc)}>{acc.active?'🔒':'✅'}</button>
            <button className="ar-reset" onClick={()=>doResetPassword(acc)}>🔑</button>
            <button className="ar-delete" onClick={()=>setConfirmModal({type:'delete', account:acc})}>🗑️</button>
          </div>
        </div>
      ))}

      {confirmModal && confirmModal.type === 'delete' && (
        <div className="confirm-overlay open">
          <div className="confirm-box">
            <div className="c-icon">⚠️</div>
            <div className="c-title">{t.confirmDeleteTitle}</div>
            <div className="c-sub">{confirmModal.account.hallName}</div>
            <div className="confirm-actions">
              <button className="confirm-cancel" onClick={()=>setConfirmModal(null)}>{t.cancel}</button>

            </div>
          </div>
        </div>
      )}
      {confirmModal && confirmModal.type === 'reset-done' && (
        <div className="confirm-overlay open">
          <div className="confirm-box">
            <div className="c-icon">✓</div>
            <div className="c-title">{t.resetSentTitle}</div>
            <div className="c-sub">{confirmModal.account.email}</div>

// ── PAYMENTS TAB ─────────────────────────────────────────────────────────
function PaymentsTab({ t }){
  const [accounts, setAccounts] = useState([]);
  const [monthlyPrice, setMonthlyPrice] = useState(1500);
  const [autoLockDay, setAutoLockDay] = useState('');
  const [payMonth, setPayMonth] = useState(new Date().getMonth());
  const [payYear, setPayYear] = useState(new Date().getFullYear());
  const [payments, setPayments] = useState({});
  const [search, setSearch] = useState('');
  const [confirmModal, setConfirmModal] = useState(null); // {account}
  const [selecting, setSelecting] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [bulkConfirm, setBulkConfirm] = useState(false);

  useEffect(() => {
    const unsub = db.collection('users').onSnapshot(snap => {
      setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = db.collection('settings').doc('billing').onSnapshot(snap => {
      if(snap.exists){
        const d = snap.data();
        if(d.monthlyPrice) setMonthlyPrice(d.monthlyPrice);
        if(d.autoLockDay !== undefined) setAutoLockDay(d.autoLockDay || '');
      }
    });
    return unsub;
  }, []);
  useEffect(() => {
    const key = `${payYear}-${payMonth}`;
    const unsub = db.collection('payments').doc(key).onSnapshot(snap => {
      setPayments(snap.exists ? snap.data() : {});
    });
    return unsub;
  }, [payMonth, payYear]);

  const monthKey = `${payYear}-${payMonth}`;
  const isPaid = (accId) => !!payments[accId];
  const paidCount = accounts.filter(a => isPaid(a.id)).length;
  const unpaidCount = accounts.length - paidCount;

  const togglePaid = async (acc) => {
    const wasPaid = isPaid(acc.id);
    await db.collection('payments').doc(monthKey).set({ [acc.id]: !wasPaid }, { merge: true });
    if(acc.active !== undefined) await db.collection('users').doc(acc.id).update({ active: wasPaid ? false : true });
    setConfirmModal(null);
  };
  const markSelectedPaid = async () => {
    const updates = {};
    selected.forEach(id => { updates[id] = true; });
    await db.collection('payments').doc(monthKey).set(updates, { merge: true });
    await Promise.all([...selected].map(id => db.collection('users').doc(id).update({ active: true }).catch(()=>{})));
    setSelected(new Set());
    setSelecting(false);
    setBulkConfirm(false);
  };
  const savePrice = async (val) => {
    setMonthlyPrice(val);
    await db.collection('settings').doc('billing').set({ monthlyPrice: val }, { merge: true });
  };
  const saveLockDay = async (val) => {
    setAutoLockDay(val);
    await db.collection('settings').doc('billing').set({ autoLockDay: val ? Number(val) : null }, { merge: true });
  };

  const filtered = accounts.filter(a => !search || (a.hallName||'').toLowerCase().includes(search.toLowerCase()) || (a.phone||'').replace(/\s/g,'').includes(search.replace(/\s/g,'')));
  const pct = accounts.length > 0 ? Math.round(paidCount / accounts.length * 100) : 0;
  const monthLabel = t.months[payMonth];

  return (
    <div>
      <div className={`card autolock-card ${autoLockDay ? 'on' : ''}`}>
        <div className={`autolock-label ${autoLockDay ? 'on' : 'off'}`}>{t.autoLockLabel}</div>
        <select className="lock-day-select" value={autoLockDay} onChange={e=>saveLockDay(e.target.value)}>
          <option value="">{t.autoLockNone}</option>
          {Array.from({length:28},(_,i)=>i+1).map(d => <option key={d} value={d}>{t.dayPrefix} {d}</option>)}
        </select>
      </div>
      <div className="card">
        <div className="label">{t.monthlyPriceLabel}</div>
        <div className="price-row">
          <div className="p-value">{monthlyPrice.toLocaleString('en-US')} <span>{t.priceSuffix}</span></div>
          <button className="edit-price-btn" onClick={()=>{ const v = prompt(t.newPricePrompt, monthlyPrice); if(v) savePrice(Number(v)); }}>{t.editBtn}</button>
        </div>
      </div>
      <div className="card">
        <div className="label">{t.monthLabel}</div>
        <div className="month-nav">
          <button onClick={()=>{ if(payMonth===0){setPayMonth(11);setPayYear(y=>y-1);} else setPayMonth(m=>m-1); }}>‹</button>
          <div className="m-label">{monthLabel} {payYear}</div>
          <button onClick={()=>{ if(payMonth===11){setPayMonth(0);setPayYear(y=>y+1);} else setPayMonth(m=>m+1); }}>›</button>
        </div>
      </div>
      <div className="stat-grid">
        <div className="stat"><div className="s-label">{t.statReceived}</div><div className="s-value" style={{color:'#1E7A63'}}>{fmtM(paidCount*monthlyPrice)}</div></div>
        <div className="stat"><div className="s-label">{t.statRemaining}</div><div className="s-value" style={{color:'var(--coral)'}}>{fmtM(unpaidCount*monthlyPrice)}</div></div>
        <div className="stat"><div className="s-label">{t.statExpected}</div><div className="s-value" style={{color:'var(--ink-muted)'}}>{fmtM(accounts.length*monthlyPrice)}</div></div>
      </div>
      <div className="card progress-card">
        <div className="p-top">
          <span style={{color:'#1E7A63'}}>{paidCount} {t.paidWord}</span>
          <span style={{color:'var(--coral)'}}>{unpaidCount} {t.unpaidWord}</span>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${pct}%`}}></div></div>
        <div className="progress-caption">{pct}% {t.collectedCaption}</div>
      </div>
      <div className="search-row">
        <div className="search-box"><input placeholder={t.searchPlaceholder} value={search} onChange={e=>setSearch(e.target.value)}/></div>
        {!selecting ? (
          <button className="icon-btn" onClick={()=>{ setSelecting(true); setSelected(new Set()); }}>☑️</button>
        ) : (
          <button className="icon-btn" style={{color:'var(--coral)'}} onClick={()=>{ setSelecting(false); setSelected(new Set()); }}>✕</button>
        )}
      </div>
      {selecting && (
        <div className="bulk-row">
          <button className="bulk-select-all" onClick={()=>setSelected(new Set(filtered.filter(a=>!isPaid(a.id)).map(a=>a.id)))}>{t.selectAllBtn}</button>
          <button
            className={`bulk-mark-paid ${selected.size>0 ? 'enabled' : ''}`}
            disabled={selected.size===0}
            onClick={()=>selected.size>0 && setBulkConfirm(true)}
          >✓ {t.markSelectedPaidBtn}{selected.size>0 ? ` (${selected.size})` : ''}</button>
        </div>
      )}
      {filtered.length === 0 && <div className="empty-state">{t.noResults}</div>}
      {filtered.map(acc => {
        const paid = isPaid(acc.id);
        const isSel = selected.has(acc.id);
        const rowClickable = selecting && !paid;
        return (
          <div
            className={`account-row ${rowClickable ? 'selectable' : ''}`}
            key={acc.id}
            onClick={rowClickable ? () => {
              const s = new Set(selected);
              s.has(acc.id) ? s.delete(acc.id) : s.add(acc.id);
              setSelected(s);
            } : undefined}
          >
            {selecting && (
              <div className={`ar-checkbox ${isSel ? 'checked' : ''}`}>{isSel ? '✓' : ''}</div>
            )}
            <div className="ar-main">
              <div className="ar-name">{acc.hallName}</div>
              <div className="ar-meta">{formatPhone(acc.phone)}</div>
              <div className={`ar-pay-line ${paid?'paid':'unpaid'}`}>{paid?`✓ ${t.paidWord} - ${monthlyPrice.toLocaleString('en-US')} ${t.currency}`:`* ${monthlyPrice.toLocaleString('en-US')} ${t.currency} ${t.dueWord}`}</div>
            </div>
            {!selecting && (
              <button className={`ar-pay-btn ${paid?'is-paid':'is-unpaid'}`} onClick={()=>setConfirmModal({account:acc})}>{paid?`✓ ${t.paidWord}`:t.receiveBtn}</button>
            )}
          </div>
        );
      })}

      {bulkConfirm && (
        <div className="confirm-overlay open">
          <div className="confirm-box">
            <div className="c-icon">💰</div>
            <div className="c-title">{t.confirmBulkTitle}</div>
            <div className="c-sub">{selected.size} {t.accountsWord} — {monthLabel} {payYear}</div>
            <div className="confirm-actions">
              <button className="confirm-cancel" onClick={()=>setBulkConfirm(false)}>{t.cancel}</button>
              <button className="confirm-ok" onClick={markSelectedPaid}>{t.confirm}</button>
            </div>
          </div>
        </div>
      )}

      {confirmModal && (() => {
        const acc = confirmModal.account;
        const willBePaid = !isPaid(acc.id);
        return (
          <div className="confirm-overlay open">
            <div className="confirm-box">
              <div className="c-icon">{willBePaid ? '💰' : '↩️'}</div>
              <div className="c-title">{willBePaid ? t.confirmMarkPaidTitle : t.confirmUnmarkTitle}</div>
              <div className="c-sub">{acc.hallName} — {monthLabel} {payYear}</div>
              <div className="confirm-actions">
                <button className="confirm-cancel" onClick={()=>setConfirmModal(null)}>{t.cancel}</button>
                <button className={willBePaid ? 'confirm-ok' : 'confirm-ok danger'} onClick={()=>togglePaid(acc)}>{willBePaid ? t.confirm : t.confirmUndoBtn}</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function ActivityTab({ t }){
  const [accounts, setAccounts] = useState([]);
  const [bookingCounts, setBookingCounts] = useState({});

  useEffect(() => {
    const unsub = db.collection('users').onSnapshot(snap => {
      setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  useEffect(() => {
    const unsubs = accounts.map(acc =>
      db.collection('bookings').doc(acc.id).onSnapshot(snap => {
        const count = snap.exists ? Object.keys(snap.data().data || {}).length : 0;
        setBookingCounts(prev => ({ ...prev, [acc.id]: count }));
      }, () => {})
    );
    return () => unsubs.forEach(fn => fn());
  }, [accounts]);

  const enriched = accounts.map(acc => {
    const bookingCount = bookingCounts[acc.id] || 0;
    return { ...acc, bookingCount, hasData: bookingCount > 0 };
  }).sort((a, b) => {
    if(a.hasData !== b.hasData) return (b.hasData?1:0) - (a.hasData?1:0);
    if(!!a.active !== !!b.active) return (b.active?1:0) - (a.active?1:0);
    return (a.hallName||'').localeCompare(b.hallName||'');
  });

  const total = enriched.length;
  const usedCount = enriched.filter(a => a.hasData).length;

  return (
    <div>
      <div className="stat-grid">
        <div className="stat"><div className="s-label">{t.statAll}</div><div className="s-value" style={{color:'var(--ink)'}}>{total}</div></div>
        <div className="stat"><div className="s-label">{t.statActive}</div><div className="s-value" style={{color:'#1E7A63'}}>{enriched.filter(a=>a.active).length}</div></div>
        <div className="stat"><div className="s-label">{t.usedAppLabel}</div><div className="s-value" style={{color:'var(--teal-deep)'}}>{usedCount}</div></div>
      </div>
      {enriched.length === 0 && <div style={{textAlign:'center', color:'var(--ink-muted)', padding:'30px 0'}}>{t.noUsers}</div>}
      {enriched.map(acc => (
        <div className="account-row" key={acc.id}>
          <div className="ar-main">
            <div className="ar-name">{acc.hallName}</div>
            <div className="ar-meta">{acc.email}</div>
            {acc.hasData && <div className="ar-meta" style={{marginTop:2}}>📅 {acc.bookingCount} {t.bookingsWord}</div>}
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:6, alignItems:'flex-end'}}>
            <span className={`account-status ${acc.active?'active':'pending'}`}>{acc.active?t.active:t.inactive}</span>
            <span className={`account-status ${acc.hasData?'active':'pending'}`}>{acc.hasData?t.statusUsed:t.statusNotUsed}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminPanel({ lang, t, onLangChange }){
  const [tab, setTab] = useState('accounts');

  // ── AUTO-LOCK ENFORCEMENT ──────────────────────────────────────────────
  // The lock-day setting used to just sit in Firestore doing nothing —
  // nothing ever read it. This runs continuously while the admin panel is
  // open: once today's date reaches the chosen day, any account that hasn't
  // been marked paid for the current month gets locked the exact same way
  // a manual toggle does (active:false) — no separate mechanism, no special
  // indicator. Since this app has no backend, it can only catch up whenever
  // the panel is open — it can't lock someone out at the exact midnight of
  // that day on its own.
  const [lockDay, setLockDay] = useState(null);
  const [lockAccounts, setLockAccounts] = useState([]);
  const [lockPayments, setLockPayments] = useState({});

  useEffect(() => {
    const unsub = db.collection('settings').doc('billing').onSnapshot(snap => {
      setLockDay(snap.exists && snap.data().autoLockDay ? snap.data().autoLockDay : null);
    });
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = db.collection('users').onSnapshot(snap => {
      setLockAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);
  useEffect(() => {
    const now = new Date();
    const key = `${now.getFullYear()}-${now.getMonth()}`;
    const unsub = db.collection('payments').doc(key).onSnapshot(snap => {
      setLockPayments(snap.exists ? snap.data() : {});
    });
    return unsub;
  }, []);
  useEffect(() => {
    if(!lockDay) return; // auto-lock disabled
    const today = new Date().getDate();
    if(today < lockDay) return; // lock day hasn't arrived yet this month
    lockAccounts.forEach(acc => {
      const paid = !!lockPayments[acc.id];
      if(acc.active && !paid){
        db.collection('users').doc(acc.id).update({ active: false });
      }
    });
  }, [lockDay, lockAccounts, lockPayments]);

  return (
    <div className="admin-panel open">
      <div className="admin-topbar">
        <h2>{t.panelTitle}</h2>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <div className="lang-switch">
            <button className={lang==='ar'?'active':''} onClick={()=>onLangChange('ar')}>AR</button>
            <button className={lang==='en'?'active':''} onClick={()=>onLangChange('en')}>EN</button>
          </div>
          <button onClick={()=>auth.signOut()}>{t.logout}</button>
        </div>
      </div>
      <div className="admin-body">
        <div className="admin-tabs">
          <button className={tab==='accounts'?'active':''} onClick={()=>setTab('accounts')}>{t.tabAccounts}</button>
          <button className={tab==='payments'?'active':''} onClick={()=>setTab('payments')}>{t.tabPayments}</button>
          <button className={tab==='activity'?'active':''} onClick={()=>setTab('activity')}>{t.tabActivity}</button>
          <button className={tab==='settings'?'active':''} onClick={()=>setTab('settings')}>{t.tabSettings}</button>
        </div>
        {tab==='accounts' && <AccountsTab t={t}/>}
        {tab==='payments' && <PaymentsTab t={t}/>}
        {tab==='activity' && <ActivityTab t={t}/>}
        {tab==='settings' && <AdminSettingsTab t={t}/>}
      </div>
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────
function Root(){
  const [authUser, setAuthUser] = useState(undefined);
  const [lang, setLang] = useState(() => localStorage.getItem('qaaty_admin_lang') || 'ar');
  const t = ADMIN_T[lang];

  const onLangChange = (l) => {
    setLang(l);
    localStorage.setItem('qaaty_admin_lang', l);
  };
  useEffect(() => {
    document.documentElement.dir = t.dir;
    document.documentElement.lang = lang;
    document.title = t.pageTitle;
  }, [lang]);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setAuthUser(u));
    return unsub;
  }, []);
  if(authUser === undefined) return <div className="loading-screen"><div className="spinner"></div></div>;
  if(!authUser || authUser.email !== ADMIN_EMAIL) return <AdminLogin lang={lang} t={t} onLangChange={onLangChange}/>;
  return <AdminPanel lang={lang} t={t} onLangChange={onLangChange}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);

</script>
</body>
</html>
