            <div className="slip-row"><span>الزبون</span><span>{dayData.clientName}</span></div>
            <div className="slip-row"><span>الهاتف</span><span className="ltr-nums">{formatPhone(dayData.phone)}</span></div>
            <div className="slip-row"><span>تاريخ المناسبة</span><span>{d.getDate()} {MONTH_NAMES[d.getMonth()]} {d.getFullYear()}</span></div>
            <div className="slip-row"><span>طريقة الدفع</span><span>{p.method || 'نقدا'}</span></div>
            <div className="slip-row"><span>المبلغ المدفوع (هذه الدفعة)</span><span>{p.amount.toLocaleString('en-US')} اوقية</span></div>
            <div className="slip-row"><span>المبلغ الإجمالي للحجز</span><span>{dayData.total.toLocaleString('en-US')} اوقية</span></div>
            <div className="slip-row"><span>مجموع المدفوع لحد الآن</span><span>{paidSoFar.toLocaleString('en-US')} اوقية</span></div>
            <div className={`receipt-highlight ${isFull?'paid-full':'paid-partial'}`}>
              <div className="rh-label">{isFull?'تم سداد المبلغ بالكامل':'المبلغ المتبقي'}</div>
              {!isFull && <div className="rh-value">{remaining.toLocaleString('en-US')} اوقية</div>}
            </div>
          </div>
        </div>
      </div>
    );
  };

  const SettingsPage = () => {
    const [editField, setEditField] = useState(null); // which field is currently being edited
    const [temp, setTemp] = useState('');
    const [resetMsg, setResetMsg] = useState(null); // {type:'ok'|'error', text}

    const startEdit = (field, currentValue) => { setTemp(currentValue); setEditField(field); };
    const saveField = async (field, setter) => {
      setter(temp);
      await db.collection('users').doc(uid).update({ [field]: temp });
      setEditField(null);
    };

    const FieldRow = ({ label, field, value, setter, ltr }) => (
      <div>
        <label style={{display:'block', fontSize:'.72rem', fontWeight:700, color:'var(--ink-muted)', marginBottom:5}}>{label}</label>
        {editField === field ? (
          <div style={{display:'flex', gap:8}}>
            <div className="field" style={{flex:1, marginBottom:0}}>
              <input value={temp} onChange={e=>setTemp(e.target.value)} style={ltr?{direction:'ltr', textAlign:'left'}:{}}/>
            </div>
            <button className="btn-save-light" onClick={()=>saveField(field, setter)}>حفظ</button>
          </div>
        ) : (
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span className={ltr?'ltr-nums':''} style={{fontWeight:700}}>{value}</span>
            <button className="btn-edit-light" onClick={()=>startEdit(field, value)}>تعديل</button>
          </div>
        )}
      </div>
    );

    return (
      <div className="page active">
        <div className="settings-group">
          <h4>معلومات القاعة</h4>
          <div className="settings-card" style={{padding:16, display:'flex', flexDirection:'column', gap:14}}>

            <div style={{display:'flex', alignItems:'center', gap:12, paddingBottom:14, borderBottom:'1px solid rgba(255,255,255,.4)'}}>
              <div className="avatar-ring" style={{width:52, height:52, margin:0, fontSize:'1.3rem'}}>{badgeLetter}</div>
              <div style={{flex:1}}>
                <label style={{display:'block', fontSize:'.72rem', fontWeight:700, color:'var(--ink-muted)', marginBottom:5}}>الحرف الظاهر في الشعار</label>
                {editField === 'badgeLetter' ? (
                  <div style={{display:'flex', gap:8}}>
                    <div className="field" style={{marginBottom:0}}>
                      <input value={temp} maxLength={1} onChange={e=>setTemp(e.target.value)} style={{width:60, textAlign:'center'}}/>
                    </div>
                    <button className="btn-save-light" onClick={()=>saveField('badgeLetter', setBadgeLetter)}>حفظ</button>
                  </div>
                ) : (
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <span style={{fontWeight:800}}>{badgeLetter}</span>
                    <button className="btn-edit-light" onClick={()=>startEdit('badgeLetter', badgeLetter)}>تعديل</button>
                  </div>
                )}
              </div>
            </div>

            <FieldRow label="اسم القاعة" field="hallName" value={hallName} setter={setHallName}/>
            <FieldRow label="رقم الهاتف" field="hallPhone" value={hallPhone} setter={setHallPhone} ltr/>
            <FieldRow label="العنوان" field="hallAddress" value={hallAddress} setter={setHallAddress}/>
            <FieldRow label="الوصف (يظهر تحت اسم القاعة)" field="tagline" value={tagline} setter={setTagline}/>
          </div>
        </div>

        <div className="settings-group">
          <h4>التفضيلات</h4>
          <div className="settings-card" style={{padding:16}}>
            <label style={{display:'block', fontSize:'.72rem', fontWeight:700, color:'var(--ink-muted)', marginBottom:8}}>اللغة</label>
            <div className="lang-pills">
              <button className={lang==='en'?'active':''} onClick={()=>onLangChange('en')}>En</button>
              <button className={lang==='fr'?'active':''} onClick={()=>onLangChange('fr')}>Fr</button>
              <button className={lang==='ar'?'active':''} onClick={()=>onLangChange('ar')}>ع</button>
            </div>
          </div>
        </div>

        <div className="settings-group">
          <h4>كلمة المرور</h4>
          <div className="settings-card" style={{padding:16}}>
            <button className="btn-edit-light" style={{width:'100%', padding:'13px'}} onClick={async()=>{
              try{ await auth.sendPasswordResetEmail(auth.currentUser.email); setResetMsg({type:'ok', text:'تم إرسال بريد إعادة التعيين!'}); }
              catch(e){ setResetMsg({type:'error', text:'تعذّر الإرسال. حاول مجددًا.'}); }
              setTimeout(()=>setResetMsg(null), 3500);
            }}>إرسال رابط إعادة تعيين كلمة المرور</button>
            {resetMsg && (
              <div className={resetMsg.type==='ok' ? 'form-success' : 'form-error'} style={{marginTop:10, marginBottom:0}}>{resetMsg.text}</div>
            )}
          </div>
        </div>
        <div className="settings-group">
          <h4>الحساب</h4>
          <div className="settings-card" style={{padding:16, marginBottom:10}}>
            <div style={{fontSize:'.85rem', color:'var(--ink-muted)'}}>{auth.currentUser?.email}</div>
          </div>
          <button className="btn-edit-light" style={{width:'100%', padding:'13px', color:'var(--coral)', background:'rgba(232,89,143,0.12)'}} onClick={()=>auth.signOut()}>تسجيل الخروج</button>
        </div>
      </div>
    );
  };

  const dateLabelFor = (dk) => {
    if(!dk) return '';
    const d = new Date(dk+'T12:00:00');
    return `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  };

  return (
    <>
      <div className="bubble b1"></div><div className="bubble b2"></div><div className="bubble b3"></div><div className="bubble b4"></div>

      <header className="hero">
        <div className="avatar-ring">{badgeLetter}</div>
        <h1>{hallName}</h1>
        <p>{tagline}</p>
      </header>

      <main>
        {page === 'home' && <HomePage/>}
        {page === 'agenda' && <AgendaPage/>}
        {page === 'earnings' && <EarningsPage/>}
        {page === 'settings' && <SettingsPage/>}
      </main>

      <div className="bottom-nav">
        <button className={page==='home'?'active':''} onClick={()=>setPage('home')} aria-label="الرئيسية">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
        </button>
        <button className={page==='agenda'?'active':''} onClick={()=>setPage('agenda')} aria-label="الأجندة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>
        <button className={page==='earnings'?'active':''} onClick={()=>setPage('earnings')} aria-label="المداخيل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h3.2a1.8 1.8 0 010 3.6h-2a1.8 1.8 0 000 3.6h3.3"/></svg>
        </button>
        <button className={page==='settings'?'active':''} onClick={()=>setPage('settings')} aria-label="الإعدادات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
        </button>
      </div>

      {selectedDay && (
        <DaySheet
          dateKey={selectedDay}
          dateLabel={dateLabelFor(selectedDay)}
          dayData={bookings[selectedDay]}
          onClose={()=>setSelectedDay(null)}
          onAddBooking={addBooking}
          onRecordPayment={recordPayment}
          onCancel={cancelBooking}
          onEditBooking={editBooking}
          onShare={()=>setDailyExportDay(selectedDay)}
          onOpenReceipt={(idx)=>setReceiptView({dateKey:selectedDay, paymentIndex:idx})}
        />
      )}

      {monthlyExportScope !== null && (
        <MonthlyExportModal scope={monthlyExportScope} onClose={()=>setMonthlyExportScope(null)}/>
      )}
      {earningsExportScope !== null && (
        <EarningsExportModal scope={earningsExportScope} onClose={()=>setEarningsExportScope(null)}/>
      )}
      {dailyExportDay && bookings[dailyExportDay] && (
        <DailyExportModal dateKey={dailyExportDay} dayData={bookings[dailyExportDay]} onClose={()=>setDailyExportDay(null)}/>
      )}
      {receiptView && bookings[receiptView.dateKey] && (
        <ReceiptModal dateKey={receiptView.dateKey} dayData={bookings[receiptView.dateKey]} paymentIndex={receiptView.paymentIndex} onClose={()=>setReceiptView(null)}/>
      )}
    </>
  );
}

// ── PENDING GATE (account created but not yet activated by admin) ───────
function PendingGate({ whatsapp }){
  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-panel active">
          <div className="login-form" style={{textAlign:'center'}}>
            <div style={{fontSize:'2.4rem', marginBottom:6}}>⏳</div>
            <h3 style={{fontSize:'1.05rem', fontWeight:800, color:'var(--teal-dark)', marginBottom:8}}>الحساب في انتظار التفعيل</h3>
            <div className="login-note">تم إنشاء حسابك. سيتم تفعيله خلال 24 ساعة بعد تأكيد الدفع.</div>
            <div style={{background:'var(--coral-soft)', borderRadius:16, padding:16, marginBottom:16}}>
              <div style={{fontSize:'.76rem', color:'var(--coral)', fontWeight:700, marginBottom:4}}>تواصل معنا عبر واتساب لتفعيل اشتراكك</div>
              <div style={{fontSize:'1.05rem', fontWeight:800, color:'var(--ink)'}}>{whatsapp}</div>
            </div>
            <button type="button" className="btn-secondary" style={{width:'100%'}} onClick={()=>auth.signOut()}>تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── ROOT APP: routes between Auth / Pending / MainApp based on Firebase state ─
function App(){
  const [authUser, setAuthUser] = useState(undefined);
  const [userDoc, setUserDoc] = useState(null);
  const [whatsapp, setWhatsapp] = useState('+222 XX XX XX XX');
  const [lang, setLang] = useState(() => localStorage.getItem('qaaty_lang') || 'ar');

  // Remember whichever language was last chosen — closing the app and
  // reopening it later should pick up right where the person left off,
  // instead of resetting to Arabic every time.
  const onLangChange = (l) => {
    setLang(l);
    localStorage.setItem('qaaty_lang', l);
  };
  useEffect(() => {
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
  }, [lang]);

  useEffect(() => {
    db.collection('settings').doc('contact').get().then(snap => {
      if(snap.exists && snap.data().whatsapp) setWhatsapp(snap.data().whatsapp);
    }).catch(()=>{});
  }, []);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => {
      if(u){
        setAuthUser(u);
        const docUnsub = db.collection('users').doc(u.uid).onSnapshot(snap => {
          setUserDoc(snap.exists ? { id: snap.id, ...snap.data() } : null);
        });
        return docUnsub;
      } else {
        setAuthUser(null);
        setUserDoc(null);
      }
    });
    return unsub;
  }, []);

  // No dedicated loading/spinner screen: Firebase's local session check is
  // near-instant, and showing a full-screen spinner first made the app feel
  // like it was "installing" rather than just opening. Going straight to the
  // login form (or straight past it, if a session is already active) reads
  // as instant instead.
  if(authUser === undefined || !authUser) return <AuthScreen lang={lang} onLangChange={onLangChange}/>;
  if(!userDoc || !userDoc.active) return <PendingGate whatsapp={whatsapp}/>;
  return <MainApp uid={authUser.uid} userDoc={userDoc} lang={lang} onLangChange={onLangChange}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
