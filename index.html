<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>قاعتي | لوحة التحكم</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="shortcut icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قاعتي">
<meta name="theme-color" content="#4D48C4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- PINNED VERSIONS — do not change to @latest, this exact combination is tested and working -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

<style>

  :root{
    --mint-1:#DAE1FF;
    --mint-2:#A9B4F5;
    --teal-3:#7B85E8;
    --teal-deep:#4D48C4;
    --teal-dark:#2A2470;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(255,255,255,0.7);
    --ink:#2A2470;
    --ink-muted:#6E68A8;
    --coral:#E8598F;
    --coral-soft:#FBDCE9;
  }
  html{
    min-height:100%;
    background:linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%);
    overflow-x:hidden;
    scrollbar-width:thin;
    scrollbar-color:rgba(77,72,196,.35) transparent;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar{ width:5px; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track{ background:transparent; }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb{ background:rgba(77,72,196,.35); border-radius:10px; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    background:linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%);
    position:relative;
    overflow-x:hidden;
    padding-bottom:100px;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }

  .bubble{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.28);
    filter:blur(1px); pointer-events:none; z-index:0;
  }

  /* Phone numbers must stay left-to-right even on an RTL page, or the
     digit groups get visually reordered by the browser's bidi algorithm. */
  .ltr-nums{ direction:ltr; unicode-bidi:embed; display:inline-block; }
  .b1{ width:180px; height:180px; top:-60px; left:-50px; }
  .b2{ width:90px; height:90px; top:120px; right:20px; background:rgba(255,255,255,.35); }
  .b3{ width:260px; height:260px; bottom:60px; right:-100px; background:rgba(255,255,255,.18); }
  .b4{ width:60px; height:60px; top:340px; left:30px; background:rgba(255,255,255,.4); }

  main, header, .owner-row{ position:relative; z-index:1; }

  /* ---------- Header ---------- */
  header.hero{ text-align:center; padding:40px 24px 14px; }
  .avatar-ring{
    width:64px; height:64px; margin:0 auto 14px;
    border-radius:50%;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; font-weight:800; color:var(--teal-deep);
    box-shadow:0 10px 26px rgba(18,61,51,.15);
  }
  .hero h1{ font-size:1.7rem; font-weight:800; color:var(--teal-dark); }
  .hero p{ margin-top:4px; font-size:.85rem; color:var(--ink-muted); }

  .owner-row{
    max-width:900px; margin:18px auto 0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 24px; font-size:.84rem; color:var(--ink-muted);
  }
  .owner-row strong{ color:var(--teal-dark); font-weight:700; }
  .logout{
    color:var(--teal-deep); text-decoration:none;
    font-weight:600; font-size:.8rem;
    background:var(--glass); padding:7px 16px; border-radius:20px;
    border:1px solid var(--glass-border);
  }

  /* ---------- Layout ---------- */
  main{ max-width:900px; margin:0 auto; padding:28px 20px 0; }

  /* ---------- Summary cards ---------- */
  .cards{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:26px;
  }
  .card{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:22px; padding:20px 20px;
    box-shadow:0 16px 34px rgba(18,61,51,.12);
  }
  .card .label{ font-size:.78rem; color:var(--ink-muted); font-weight:500; }
  .card .value{ font-size:1.5rem; font-weight:800; margin-top:8px; color:var(--teal-dark); font-variant-numeric:tabular-nums; }
  .card .sub{ font-size:.72rem; color:var(--ink-muted); margin-top:5px; }
  .card.accent .value{ color:var(--coral); }

  .panel{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:26px; padding:24px;
    box-shadow:0 16px 34px rgba(18,61,51,.12);
  }

  /* ---------- Calendar ---------- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-head h2{ color:var(--teal-dark); font-size:1.2rem; font-weight:800; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:30px; height:30px; border-radius:50%;
    border:none; background:var(--glass-strong);
    color:var(--teal-deep); font-size:1rem; cursor:pointer;
  }
  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; }
  .weekdays span{ text-align:center; font-size:.72rem; color:var(--ink-muted); font-weight:700; padding-bottom:6px; }
  .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .day{
    aspect-ratio:1/1; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:700; color:var(--ink);
    background:rgba(255,255,255,0.35);
    border:1px solid transparent; cursor:pointer;
    transition:transform .12s ease;
  }
  .day:hover{ transform:translateY(-2px); }
  .day.empty{ background:transparent; cursor:default; }
  .day.empty:hover{ transform:none; }
  .day.today{ border-color:var(--teal-deep); }
  .day.booked{ color:#fff; background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); box-shadow:0 8px 18px rgba(30,122,99,.35); }
  .day.pending{ color:var(--coral); background:var(--coral-soft); border:1.5px dashed var(--coral); }
  .day.selected{ outline:2px solid var(--teal-dark); outline-offset:2px; }

  .legend{ display:flex; gap:18px; margin-top:20px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-muted); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend i{ width:12px; height:12px; border-radius:5px; display:inline-block; }
  .legend i.booked{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); }
  .legend i.pending{ background:var(--coral-soft); border:1.5px dashed var(--coral); }
  .legend i.free{ background:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,.6); }

  .hint-row{
    display:flex; align-items:center; gap:8px;
    margin-top:16px; padding:12px 14px;
    background:rgba(255,255,255,.3); border-radius:14px;
    font-size:.76rem; color:var(--ink-muted);
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px;
    background:var(--glass-strong);
    backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:30px; padding:10px 18px;
    box-shadow:0 16px 34px rgba(18,61,51,.18);
    z-index:2;
  }
  .bottom-nav button{
    width:40px; height:40px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted); cursor:pointer;
  }
  .bottom-nav button.active{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }
  .bottom-nav svg{ width:19px; height:19px; }

  @media (max-width: 760px){ .cards{ grid-template-columns:1fr; } }

  /* ---------- Bottom sheets (shared) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(42,36,112,0.35);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:none; align-items:flex-end; justify-content:center;
    z-index:10;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    background:linear-gradient(165deg, #6259D6, #4A42B0);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:28px 28px 0 0;
    padding:22px 22px 28px;
    box-shadow:0 -20px 50px rgba(42,36,112,.4);
    animation:sheetUp .22s ease-out;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.3) transparent;
  }
  .sheet::-webkit-scrollbar{ width:5px; }
  .sheet::-webkit-scrollbar-track{ background:transparent; }
  .sheet::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.3); border-radius:10px; }
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,0.25); margin:0 auto 16px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .sheet-head h3{ font-size:1.15rem; font-weight:800; color:#F1EEFB; }
  .sheet-close{
    width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.14); color:#F1EEFB; font-size:1rem; cursor:pointer;
  }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.78rem; font-weight:700; color:#D6D1F5; margin-bottom:7px; }
  .field input, .field select{
    width:100%; font-family:'Tajawal', sans-serif; font-size:.9rem; color:var(--ink);
    background:rgba(255,255,255,0.92);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:14px; padding:12px 14px; outline:none;
  }
  .field input:focus, .field select:focus{ border-color:#fff; background:#fff; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .sheet-actions{ display:flex; gap:10px; margin-top:22px; }
  .btn-primary{
    flex:1; background:#fff;
    color:var(--teal-deep); border:none; border-radius:16px; padding:14px;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.9rem; cursor:pointer;
    box-shadow:0 12px 26px rgba(0,0,0,.2);
  }
  .btn-secondary{
    background:rgba(255,255,255,0.14); color:#F1EEFB; border:none;
    border-radius:16px; padding:14px 20px;
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:.9rem; cursor:pointer;
  }
  .btn-ghost{
    width:100%; background:none; border:1.5px dashed rgba(255,255,255,0.5);
    color:#F1EEFB; border-radius:16px; padding:14px;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.88rem; cursor:pointer;
  }

  /* ---------- Day details sheet ---------- */
  .ds-title{ font-size:1.1rem; font-weight:800; color:#F1EEFB; margin-bottom:2px; }
  .ds-date{ font-size:.78rem; color:#D6D1F5; margin-bottom:14px; }
  .form-error{
    background:rgba(232,89,143,0.18); color:#FBD9E6; font-size:.78rem; font-weight:700;
    padding:10px 14px; border-radius:12px; margin-bottom:14px;
  }
  .form-success{
    background:rgba(30,122,99,0.18); color:#B7F0DC; font-size:.78rem; font-weight:700;
    padding:10px 14px; border-radius:12px; margin-bottom:14px;
  }
  .date-field{
    direction:ltr; position:relative; display:flex; align-items:center; justify-content:space-between;
    width:100%; background:rgba(255,255,255,0.92); border:1px solid rgba(255,255,255,0.2);
    border-radius:14px; padding:12px 14px; color:var(--ink-muted);
  }
  .date-field-icon-btn{ background:none; border:none; padding:0; display:flex; color:var(--ink-muted); cursor:pointer; }
  .date-field-values{ display:flex; align-items:center; gap:6px; }
  .date-field input{
    width:34px; border:none; background:none; outline:none; padding:0;
    font-family:'Tajawal', sans-serif; font-size:.9rem; color:var(--ink); text-align:center;
    -moz-appearance:textfield;
  }
  .date-field input::-webkit-outer-spin-button, .date-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .date-picker-popup{
    position:absolute; top:calc(100% + 8px); left:0; z-index:20;
    width:260px; background:#fff; border-radius:16px; padding:14px;
    box-shadow:0 16px 36px rgba(18,61,51,.25); direction:ltr;
  }
  .date-picker-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .date-picker-nav button{ background:var(--glass); border:none; width:28px; height:28px; border-radius:50%; color:var(--teal-deep); font-size:1rem; }
  .date-picker-nav span{ font-size:.84rem; font-weight:800; color:var(--ink); }
  .date-picker-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
  .date-picker-weekdays span{ text-align:center; font-size:.62rem; font-weight:700; color:var(--ink-muted); }
  .date-picker-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .date-picker-grid button{
    aspect-ratio:1/1; border:none; border-radius:8px; background:var(--bg,#F3F2FF);
    font-size:.76rem; font-weight:700; color:var(--ink); font-family:'Tajawal', sans-serif;
  }
  .date-picker-grid button.selected{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }
  .date-picker-backdrop{ position:fixed; inset:0; z-index:19; }
  .date-field span{ color:var(--ink-muted); font-size:.85rem; }
  .badge{ display:inline-block; padding:5px 14px; border-radius:20px; font-size:.72rem; font-weight:700; margin-bottom:16px; }
  .badge.booked{ background:rgba(255,255,255,0.18); color:#DFFAF0; }
  .badge.pending{ background:rgba(255,255,255,0.9); color:var(--coral); }
  .badge.free{ background:rgba(255,255,255,0.16); color:#EDEBFA; }

  .info-row{
    display:flex; justify-content:space-between; padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,0.14); font-size:.84rem;
  }
  .info-row span:first-child{ color:#D6D1F5; }
  .info-row span:last-child{ font-weight:700; color:#FDFCFF; }

  .deposit-bar{ margin-top:16px; margin-bottom:6px; background:rgba(255,255,255,.18); border-radius:20px; height:8px; overflow:hidden; }
  .deposit-fill{ height:100%; background:#fff; border-radius:20px; }
  .deposit-caption{ font-size:.72rem; color:#D6D1F5; display:flex; justify-content:space-between; }

  .empty-state{ text-align:center; padding:36px 10px; color:#D6D1F5; font-size:.84rem; line-height:1.8; }

  .ds-section-title{
    font-size:.78rem; font-weight:800; color:#D6D1F5;
    margin:22px 0 10px;
  }
  .payment-history{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .payment-row{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.14); border-radius:14px; padding:10px 14px;
  }
  .payment-row .p-date{ font-size:.78rem; color:#D6D1F5; }
  .payment-row .p-amount{ font-size:.86rem; font-weight:800; color:#FDFCFF; }
  .receipt-icon-btn{
    width:26px; height:26px; border-radius:50%; border:none; flex-shrink:0;
    background:rgba(255,255,255,0.14); color:#F1EEFB; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .receipt-icon-btn svg{ width:13px; height:13px; }

  .inline-payment{
    margin-top:16px; padding:16px; background:rgba(255,255,255,0.1);
    border-radius:18px; border:1px dashed rgba(255,255,255,0.4);
  }
  .inline-payment .ip-label{ font-size:.78rem; font-weight:700; color:#F1EEFB; margin-bottom:10px; }
  .inline-payment .field-row{ align-items:end; }
  .inline-payment button{
    width:100%; margin-top:10px;
    background:var(--coral); color:#fff; border:none; border-radius:14px;
    padding:12px; font-family:'Tajawal', sans-serif; font-weight:800; font-size:.86rem; cursor:pointer;
  }

  /* ---------- Record payment sheet ---------- */
  .remaining-box{
    background:var(--coral-soft);
    border-radius:16px; padding:16px 18px; text-align:center; margin-bottom:18px;
  }
  .remaining-box .r-label{ font-size:.76rem; color:var(--coral); font-weight:700; }
  .remaining-box .r-value{ font-size:1.5rem; font-weight:800; color:var(--coral); margin-top:4px; }
  .btn-pay-full{
    background:none; border:none; color:#EDEBFA;
    font-family:'Tajawal', sans-serif; font-size:.78rem; font-weight:700;
    text-decoration:underline; cursor:pointer; padding:0; margin-top:8px;
  }

  /* ---------- Agenda ---------- */
  .search-row{ display:flex; gap:10px; margin-bottom:14px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:10px 14px;
  }
  .search-box svg{ width:16px; height:16px; color:var(--ink-muted); flex-shrink:0; }
  .search-box input{
    border:none; background:transparent; outline:none;
    font-family:'Tajawal', sans-serif; font-size:.84rem; color:var(--ink); width:100%;
  }
  .month-select{
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:10px 12px;
    font-family:'Tajawal', sans-serif; font-size:.8rem; color:var(--ink); font-weight:700;
  }

  .filter-chips{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--glass-border); background:var(--glass); color:var(--ink-muted);
    font-family:'Tajawal', sans-serif; font-size:.78rem; font-weight:700;
    padding:8px 16px; border-radius:20px; cursor:pointer;
  }
  .chip.active{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; border-color:transparent; }

  .agenda-list{ display:flex; flex-direction:column; gap:12px; }
  .agenda-item{
    display:flex; align-items:center; gap:14px;
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:20px; padding:14px 16px;
    box-shadow:0 12px 28px rgba(18,61,51,.1); cursor:pointer;
  }
  .agenda-date{
    flex-shrink:0; width:52px; height:52px; border-radius:14px;
    background:var(--glass-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--teal-dark);
  }
  .agenda-date .num{ font-size:1.05rem; font-weight:800; line-height:1; }
  .agenda-date .mon{ font-size:.62rem; color:var(--ink-muted); margin-top:2px; }
  .agenda-item.booked .agenda-date{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); }
  .agenda-item.booked .agenda-date .num, .agenda-item.booked .agenda-date .mon{ color:#fff; }
  .agenda-item.pending .agenda-date{ background:var(--coral-soft); }
  .agenda-item.pending .agenda-date .num, .agenda-item.pending .agenda-date .mon{ color:var(--coral); }

  .agenda-info{ flex:1; min-width:0; }
  .agenda-info .name{ font-size:.9rem; font-weight:800; color:var(--ink); }
  .agenda-info .meta{ font-size:.76rem; color:var(--ink-muted); margin-top:3px; }
  .agenda-status{ flex-shrink:0; font-size:.7rem; font-weight:700; padding:5px 12px; border-radius:16px; }
  .agenda-item.booked .agenda-status{ background:rgba(30,122,99,0.15); color:var(--teal-deep); }
  .agenda-item.pending .agenda-status{ background:var(--coral-soft); color:var(--coral); }

  /* ---------- Earnings: month cards & detail ---------- */
  .month-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:22px; padding:20px 20px;
    box-shadow:0 14px 32px rgba(18,61,51,.12); cursor:pointer;
  }

       nested inside #root, not a direct child — so that rule was hiding
       #root itself, taking the PDF content down with it. Hiding everything
       by visibility instead, then re-revealing just the overlay, works no
       matter how deep it's nested. */
    body *{ visibility:hidden; }
    .print-overlay, .print-overlay *{ visibility:visible; }
    /* position:static (not fixed or absolute) avoids a known print-pagination
       bug in Safari/WebKit where positioned elements can misbehave or repeat
       across pages. overflow:visible + height:auto lets the browser paginate
       freely across as many pages as the content needs, instead of clipping
       everything to one screen-height window (which was cutting PDFs short). */
    html, body{ height:auto !important; overflow:visible !important; }
    .print-overlay{
      position:static !important;
      overflow:visible !important; height:auto !important; max-height:none !important;
      width:100%; background:#fff; padding:0;

       save ink) unless explicitly told not to — this is why the green/pink
       status colors were showing on some devices and not others. */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }

function toKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtM(n){
  // matches StadBook exactly: only compacts at 1,000,000+, floors, comma as decimal separator
  if(n < 1000000) return n.toLocaleString('en-US');
  const m = Math.floor(n / 1000000);
  const d = Math.floor((n % 1000000) / 100000);
  return d > 0 ? `${m},${d}M` : `${m}M`;
}
function formatPhone(p){ return (p||'').replace(/(\d{2})(?=\d)/g, '$1 ').trim(); }

// Payment method is stored as a language-neutral key ('cash'/'other') so it
// can be translated correctly no matter which language is displaying it —
// only "Cash" and "Other" are generic labels that need translation; brand
// names (Bankily, Masrvi, Sedad, etc.) are proper nouns and stay as-is in
// every language. Old records saved before this fix stored the literal
// Arabic word directly ('نقدا'/'أخرى') — recognized here too, so previously
// saved payments also display correctly in every language, not just new ones.
function formatPaymentMethod(method, t){
  if(!method || method === 'cash' || method === 'نقدا') return t.cashMethod;
  if(method === 'other' || method === 'أخرى') return t.otherMethod;
  return method;
}
function getMonthGrid(y, m){
  const first = new Date(y, m, 1), cells = [];
  for(let i=0; i<first.getDay(); i++) cells.push(null);
  for(let d=1; d<=new Date(y, m+1, 0).getDate(); d++) cells.push(new Date(y, m, d));
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

// Escapes user-entered data (names, phones, etc.) before it's dropped into a
// raw HTML string for the print document, so a stray "<" or "&" in a client
// name can't break the markup.
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

  .doc-header .mark{ width:38px; height:38px; border-radius:50%; background:#EEEDFB; color:#4D48C4; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.05rem; }
  .doc-header h1{ font-size:1.02rem; font-weight:800; color:#1E1B3A; }
  .doc-header .sub{ font-size:.7rem; color:#6B6785; margin-top:1px; }
  .doc-header .meta{ text-align:${metaAlign}; font-size:.68rem; color:#6B6785; line-height:1.6; }

  .doc-title{ text-align:center; margin-bottom:22px; }
  .doc-title h2{ font-size:1.1rem; font-weight:800; color:#1E1B3A; }
  .doc-title p{ font-size:.76rem; color:#6B6785; margin-top:3px; }

  .doc table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  .doc thead th{ background:#EEEDFB; color:#4D48C4; font-weight:700; padding:9px 8px; text-align:center; border-bottom:2px solid #4D48C4; }
  .doc tbody td{ padding:11px 8px; text-align:center; border-bottom:1px solid #E3E1F2; color:#1E1B3A; }
  .doc tbody tr:nth-child(even){ background:#FAFAFD; }
  .status-pill{ display:inline-block; padding:3px 10px; border-radius:12px; font-size:.68rem; font-weight:700; }
  .status-pill.booked{ background:rgba(30,122,99,.12); color:#1E7A63; }
  .status-pill.pending{ background:rgba(232,89,143,.12); color:#E8598F; }

  .doc-footer{ margin-top:24px; padding-top:14px; border-top:1px solid #E3E1F2; display:flex; justify-content:space-between; font-size:.68rem; color:#6B6785; }

  .slip{ border:2px dashed #E3E1F2; border-radius:16px; padding:24px; text-align:center; }
  .slip .authorize{ font-size:.75rem; font-weight:700; color:#4D48C4; letter-spacing:.5px; margin-bottom:6px; }
  .slip .date-big{ font-size:1.9rem; font-weight:800; margin-bottom:2px; color:#1E1B3A; }
  .slip .weekday{ font-size:.8rem; color:#6B6785; margin-bottom:20px; }
  .slip-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 4px; border-bottom:1px solid #E3E1F2; text-align:right; }
  .slip-row span:first-child{ font-size:.76rem; color:#6B6785; }
  .slip-row span:last-child{ font-size:.9rem; font-weight:700; color:#1E1B3A; }
  .slip .badge-big{ display:inline-block; margin-top:18px; padding:8px 20px; border-radius:20px; font-weight:800; font-size:.82rem; background:rgba(30,122,99,.12); color:#1E7A63; }
  .slip .badge-big.pending{ background:rgba(232,89,143,.12); color:#E8598F; }
  .slip .note{ margin-top:20px; font-size:.7rem; color:#6B6785; line-height:1.7; }

  .receipt-highlight{ margin-top:16px; padding:16px; border-radius:12px; text-align:center; }
  .receipt-highlight.paid-full{ background:rgba(30,122,99,.1); color:#1E7A63; }
  .receipt-highlight.paid-partial{ background:rgba(232,89,143,.1); color:#E8598F; }
  .receipt-highlight .rh-label{ font-size:.74rem; font-weight:700; }
  .receipt-highlight .rh-value{ font-size:1.15rem; font-weight:800; margin-top:4px; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; padding:0; }
    .doc{ box-shadow:none; margin:0; max-width:100%; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
</style>
</head>
<body>
  <div class="print-topbar no-print">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
      ${escapeHtml(t.printSaveBtn)}
    </button>

  <div class="doc">

      <div class="brand">
        <div class="mark">${escapeHtml(badgeLetter)}</div>
        <div><h1>${escapeHtml(hallName)}</h1><div class="sub">${escapeHtml(tagline)}</div></div>
      </div>
      <div class="meta">${escapeHtml(hallPhone)}<br>${escapeHtml(hallAddress)}</div>
    </div>
    ${bodyHtml}
  </div>
</body>
</html>`;
  w.document.open();
  w.document.write(html);

// Custom date field — the browser's native date picker renders its own OS
// language and layout (e.g. showing month names in English regardless of app
// language). This gives full control: always numeric DD/MM/YYYY, and a real
// calendar picker button alongside direct number entry.
function DateField({ value, onChange, t }){
  const [y, m, d] = value.split('-').map(Number);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [pickerMonth, setPickerMonth] = useState(m-1);
  const [pickerYear, setPickerYear] = useState(y);

  const set = (day, month, year) => {
    const dd = String(Math.min(31, Math.max(1, day))).padStart(2,'0');
    const mm = String(Math.min(12, Math.max(1, month))).padStart(2,'0');
    const yyyy = String(year).padStart(4,'0');
    onChange(`${yyyy}-${mm}-${dd}`);
  };

  const openPicker = () => { setPickerMonth(m-1); setPickerYear(y); setPickerOpen(true); };
  const grid = getMonthGrid(pickerYear, pickerMonth);
  const prevMonth = () => { if(pickerMonth===0){setPickerMonth(11);setPickerYear(yr=>yr-1);} else setPickerMonth(mo=>mo-1); };
  const nextMonth = () => { if(pickerMonth===11){setPickerMonth(0);setPickerYear(yr=>yr+1);} else setPickerMonth(mo=>mo+1); };

  return (
    <div className="date-field">
      <button type="button" className="date-field-icon-btn" onClick={()=>pickerOpen ? setPickerOpen(false) : openPicker()}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
      <div className="date-field-values">
        <input type="number" min="1" max="31" value={d} onChange={e=>set(Number(e.target.value)||1, m, y)}/>
        <span>/</span>
        <input type="number" min="1" max="12" value={m} onChange={e=>set(d, Number(e.target.value)||1, y)}/>
        <span>/</span>
        <input type="number" min="2020" max="2100" value={y} onChange={e=>set(d, m, Number(e.target.value)||y)} style={{width:52}}/>
      </div>

      {pickerOpen && (
        <>
          <div className="date-picker-backdrop" onClick={()=>setPickerOpen(false)}></div>
          <div className="date-picker-popup" onClick={e=>e.stopPropagation()}>
            <div className="date-picker-nav">
              <button type="button" onClick={prevMonth}>‹</button>
              <span>{t.months[pickerMonth]} {pickerYear}</span>
              <button type="button" onClick={nextMonth}>›</button>
            </div>
            <div className="date-picker-weekdays">
              <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>
            <div className="date-picker-grid">
              {grid.map((dt, i) => {
                if(!dt) return <div key={i}></div>;
                const isSelected = dt.getDate()===d && dt.getMonth()===m-1 && dt.getFullYear()===y;
                return (
                  <button type="button" key={i} className={isSelected?'selected':''} onClick={()=>{
                    set(dt.getDate(), dt.getMonth()+1, dt.getFullYear());
                    setPickerOpen(false);
                  }}>{dt.getDate()}</button>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function DaySheet({ dateKey, dateLabel, dayData, onClose, onAddBooking, onRecordPayment, onCancel, onShare, onOpenReceipt, onEditBooking, t }){
  const [screen, setScreen] = useState(dayData ? 'view' : 'empty');
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [total, setTotal] = useState('');
  const [paidNow, setPaidNow] = useState('');
  const [payAmount, setPayAmount] = useState('');
  const [payMethod, setPayMethod] = useState('cash');
  const [payDate, setPayDate] = useState(toKey(new Date()));
  const [payError, setPayError] = useState('');
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [addError, setAddError] = useState('');
  const [editName, setEditName] = useState('');
  const [editPhone, setEditPhone] = useState('');
  const [editTotal, setEditTotal] = useState('');
  const [editError, setEditError] = useState('');
  const dragStartY = React.useRef(0);
  const draggingRef = React.useRef(false);
  const dragYRef = React.useRef(0);
  const handleWrapRef = React.useRef(null);
  const sheetContentRef = React.useRef(null);

  // Native (non-passive) listeners for the drag handle — JSX onTouchMove is
  // attached passively by React by default, so preventDefault() inside it can
  // silently no-op, which is why the background sometimes still moved.
  React.useEffect(() => {
    const el = handleWrapRef.current;
    const sheetEl = sheetContentRef.current;
    if(!el || !sheetEl) return;

    const onStart = (e) => {
      dragStartY.current = e.touches[0].clientY;
      draggingRef.current = true;
      sheetEl.style.transition = 'none'; // direct DOM write, no re-render
    };
    const onMove = (e) => {
      if(!draggingRef.current) return;
      const delta = e.touches[0].clientY - dragStartY.current;
      if(delta > 0){
        e.preventDefault(); // real native prevent — stops the page behind from moving
        e.stopPropagation(); // don't also trigger the sheet's own scroll-boundary listener
        dragYRef.current = delta;
        sheetEl.style.transform = `translateY(${delta}px)`; // direct DOM write — tracks the finger every frame with no React re-render
      }
    };
    const onEnd = (e) => {
      draggingRef.current = false;
      sheetEl.style.transition = 'transform .25s ease';
      if(dragYRef.current > 5){
        e.preventDefault(); // only swallow the tap when an actual drag happened
        e.stopPropagation();
        if(dragYRef.current > 90){
          onClose();
        } else {
          sheetEl.style.transform = 'translateY(0px)'; // snap back
        }
      }
      // a plain tap (dragYRef.current ~0, e.g. tapping the ✕) is left alone
      // so the browser's normal click event still fires on the close button
      dragYRef.current = 0;
    };

    el.addEventListener('touchstart', onStart, { passive:true });
    el.addEventListener('touchmove', onMove, { passive:false });
    el.addEventListener('touchend', onEnd, { passive:false });
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
    };
  }, [onClose]);

  // Contain scrolling inside the sheet's own content so hitting the top/bottom
  // doesn't rubber-band into the page behind it (can't use overscroll-behavior
  // here — it broke Samsung's single-finger scroll elsewhere in the app).
  React.useEffect(() => {
    const el = sheetContentRef.current;
    if(!el) return;
    let startY = 0;

    const onStart = (e) => { startY = e.touches[0].clientY; };
    const onMove = (e) => {
      const delta = e.touches[0].clientY - startY;
      const atTop = el.scrollTop <= 0;
      const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
      if((atTop && delta > 0) || (atBottom && delta < 0)){
        e.preventDefault();
      }
    };

    el.addEventListener('touchstart', onStart, { passive:true });
    el.addEventListener('touchmove', onMove, { passive:false });
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
    };
  }, []);

  const paid = dayData ? (dayData.payments||[]).reduce((a,p)=>a+p.amount,0) : 0;
  const remaining = dayData ? dayData.total - paid : 0;
  const pct = dayData ? Math.round((paid / dayData.total) * 100) : 0;
  const status = remaining > 0 ? 'pending' : 'booked';
  const sortedPayments = dayData ? [...(dayData.payments||[])].sort((a,c)=>a.date.localeCompare(c.date)) : [];

  return (
    <div className="overlay open">
      <div
        className="sheet"
        ref={sheetContentRef}
        style={{ transform:'translateY(0px)', transition: 'transform .25s ease' }}
      >
        <div
          ref={handleWrapRef}
          style={{ cursor:'grab', touchAction:'none' }}
        >
          <div className="sheet-handle"></div>
          <div className="sheet-head">
            <h3>{dayData ? dayData.clientName : dateLabel}</h3>
            <button className="sheet-close" onClick={onClose}>✕</button>
          </div>
        </div>

        {screen === 'empty' && !dayData && (
          <>
            <span className="badge free">{t.badgeFree}</span>
            <p style={{fontSize:'.85rem', color:'var(--ink-muted)', lineHeight:1.8, marginBottom:18}}>{t.noBookingYet}</p>
            <button className="btn-primary" style={{width:'100%'}} onClick={()=>setScreen('add')}>{t.addBookingBtn}</button>
          </>
        )}

        {screen === 'add' && !dayData && (
          <form onSubmit={e=>{
            e.preventDefault();
            if(!name.trim() || !phone.trim() || !total){ setAddError(t.errFillRequired); return; }
            const totalNum = Number(total);
            const paidNowNum = Number(paidNow)||0;
            if(paidNowNum > totalNum){ setAddError(t.errPaidExceedsTotal); return; }
            const freshData = onAddBooking(dateKey, { clientName:name.trim(), phone:phone.trim(), total:totalNum, paidNow:paidNowNum, method:payMethod });
            setAddError('');
            onClose();
            if(paidNowNum > 0) onOpenReceipt(0, freshData); // a payment was made at booking time — show the receipt right away, using the just-created data directly

                  <option value="cash">{t.cashMethod}</option>

                  <option value="Masrvi">Masrvi</option>
                  <option value="Sedad">Sedad</option>
                  <option value="BimBank">BimBank</option>
                  <option value="Amanty">Amanty</option>
                  <option value="Click">Click</option>
                  <option value="BCIpay">BCIpay</option>

                  <option value="other">{t.otherMethod}</option>

        )}

  );

// ── AGENDA PAGE (moved to top-level so it keeps its own filter/search state
// across MainApp re-renders — e.g. closing a sheet no longer resets it) ──
function AgendaPage({ bookings, onSelectDay, onExport, t }){
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [monthFilter, setMonthFilter] = useState('all');

  const monthKeys = useMemo(() => {
    const keys = new Set(Object.keys(bookings).map(dk => dk.slice(0,7))); // "YYYY-MM"
    return Array.from(keys).sort();
  }, [bookings]);

  const entries = useMemo(() => {
    return Object.entries(bookings)
      .filter(([dk]) => monthFilter === 'all' || dk.slice(0,7) === monthFilter)
      .map(([dk, b]) => {
        const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
        const status = paid < b.total ? 'pending' : 'booked';
        return { dk, ...b, paid, status };
      })
      .filter(b => filter === 'all' || b.status === filter)
      .filter(b => !search.replace(/\s/g,'') || b.phone.replace(/\s/g,'').includes(search.replace(/\s/g,'')))
      .sort((a,b) => a.dk.localeCompare(b.dk));
  }, [bookings, filter, monthFilter, search]);

  return (
    <div className="page active">
      <div className="search-row">
        <div className="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="tel" placeholder={t.searchByPhonePlaceholder} value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="month-select" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
          <option value="all">{t.allMonths}</option>
          {monthKeys.map(mk => {
            const [y,m] = mk.split('-');
            return <option key={mk} value={mk}>{t.months[parseInt(m,10)-1]} {y}</option>;
          })}
        </select>
        <button className="export-icon-btn" aria-label={t.exportGuardAria} onClick={()=>onExport(monthFilter)}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        </button>
      </div>
      <div className="filter-chips">
        <button className={`chip ${filter==='all'?'active':''}`} onClick={()=>setFilter('all')}>{t.filterAll}</button>
        <button className={`chip ${filter==='booked'?'active':''}`} onClick={()=>setFilter('booked')}>{t.badgeBooked}</button>
        <button className={`chip ${filter==='pending'?'active':''}`} onClick={()=>setFilter('pending')}>{t.badgePending}</button>
      </div>
      <div style={{fontSize:'.78rem', color:'var(--ink-muted)', marginBottom:12}}>{entries.length} {t.bookingsCountSuffix}</div>
      <div className="agenda-list">
        {entries.length === 0 && <div className="empty-state">{t.noMatchingResults}</div>}
        {entries.map(b => {
          const d = new Date(b.dk+'T12:00:00');
          return (
            <div className={`agenda-item ${b.status}`} key={b.dk} onClick={()=>onSelectDay(b.dk)}>
              <div className="agenda-date">
                <div className="num">{d.getDate()}</div>
                <div className="mon">{t.months[d.getMonth()]}</div>
              </div>
              <div className="agenda-info">
                <div className="name">{b.clientName}</div>
                <div className="meta ltr-nums">{formatPhone(b.phone)}</div>
              </div>
              <div className="agenda-status">{b.status==='pending'?t.badgePending:t.badgeBooked}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── EARNINGS PAGE (moved to top-level so drilledMonth survives MainApp
// re-renders — e.g. closing the info sheet or an export no longer resets it) ──
function EarningsPage({ bookings, onSelectDay, onExport, t }){
  const [drilledMonth, setDrilledMonth] = useState(null);

  // Flatten every payment across every booking into one list, tagged with
  // its own real payment date — this is the source of truth for "earnings",
  // completely independent of which month the underlying event falls in.
  const allPayments = useMemo(() => {
    const list = [];
    Object.entries(bookings).forEach(([dk, b]) => {
      (b.payments||[]).forEach(p => {
        list.push({ ...p, bookingDateKey: dk, clientName: b.clientName, phone: b.phone });
      });
    });
    return list;
  }, [bookings]);

  const statsForMonthKey = (mk) => {
    const pays = allPayments.filter(p => (p.date||'').slice(0,7) === mk);
    const total = pays.reduce((s,p)=>s+p.amount, 0);
    return { total, count: pays.length };
  };
  const remainingAcrossAllBookings = useMemo(() => {
    return Object.values(bookings).reduce((s,b)=>{
      const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
      return s + Math.max(0, b.total - paid);
    }, 0);
  }, [bookings]);

  const allMonthKeys = useMemo(() => Array.from(new Set(allPayments.map(p=>(p.date||'').slice(0,7)))).filter(Boolean).sort((a,b)=>b.localeCompare(a)), [allPayments]);
  const statsAll = useMemo(() => allMonthKeys.reduce((acc,mk)=>{
    const s = statsForMonthKey(mk);
    acc.total+=s.total; acc.count+=s.count;
    return acc;
  }, {total:0,count:0}), [bookings, allMonthKeys]);

  const shownTotal = drilledMonth ? statsForMonthKey(drilledMonth).total : statsAll.total;
  const shownCount = drilledMonth ? statsForMonthKey(drilledMonth).count : statsAll.count;

  const monthPayments = useMemo(() => {
    if(!drilledMonth) return [];
    return allPayments
      .filter(p => (p.date||'').slice(0,7) === drilledMonth)
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  }, [allPayments, drilledMonth]);

  return (
    <div className="page active">
      {!drilledMonth ? (
        <>
          <div className="cards" style={{gridTemplateColumns:'1fr 1fr', marginBottom:18}}>
            <div className="card">
              <div className="label">{t.totalIncomeLabel}</div>
              <div className="value">{fmtM(shownTotal)} {t.currency}</div>
              <div className="sub">{shownCount} {t.paymentsCountSuffix}</div>
            </div>
            <div className="card accent">
              <div className="label">{t.remainingDepositsLabel}</div>
              <div className="value">{fmtM(remainingAcrossAllBookings)} {t.currency}</div>
              <div className="sub">{t.acrossPendingBookings}</div>
            </div>
          </div>
          <button className="export-earnings-btn" onClick={()=>onExport('all')}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
            {t.exportAllPdfBtn}
          </button>
          <div className="agenda-list">
            {allMonthKeys.length === 0 && <div className="empty-state">{t.noDataYet}</div>}
            {allMonthKeys.map(mk => {
              const s = statsForMonthKey(mk);
              const [y,m] = mk.split('-');
              return (
                <div className="month-card" key={mk} onClick={()=>setDrilledMonth(mk)}>
                  <div>
                    <div className="mc-name">{t.months[parseInt(m,10)-1]} {y}</div>
                    <div className="mc-sub">{s.count} {t.paymentsCountSuffix}</div>
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:10}}>
                    <div className="mc-total">{fmtM(s.total)} {t.currency}</div>
                    <span className="mc-arrow">‹</span>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      ) : (
        <>
          <div className="month-detail-head">
            <button onClick={()=>setDrilledMonth(null)} aria-label={t.backAria}>‹</button>
            <h2>{(() => { const [y,m]=drilledMonth.split('-'); return `${t.months[parseInt(m,10)-1]} ${y}`; })()}</h2>
          </div>
          <div className="card" style={{margin:'14px 0'}}>
            <div className="label">{t.totalThisMonthLabel}</div>
            <div className="value">{fmtM(shownTotal)} {t.currency}</div>
            <div className="sub">{shownCount} {t.paymentsCountSuffix}</div>
          </div>
          <button className="export-earnings-btn" onClick={()=>onExport(drilledMonth)}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
            {t.exportMonthPdfBtn}
          </button>
          <div className="ds-section-title" style={{color:'var(--ink-muted)'}}>{t.paymentsTitle}</div>
          <div className="agenda-list">
            {monthPayments.length === 0 && <div className="empty-state">{t.noPaymentsThisMonth}</div>}
            {monthPayments.map((p,i) => {
              const d = new Date(p.date+'T12:00:00');
              return (
                <div className="agenda-item booked" key={p.id||i} onClick={()=>onSelectDay(p.bookingDateKey)}>
                  <div className="agenda-date">
                    <div className="num">{d.getDate()}</div>
                    <div className="mon">{t.months[d.getMonth()]}</div>
                  </div>
                  <div className="agenda-info">
                    <div className="name">{p.clientName}</div>
                    <div className="meta">{formatPaymentMethod(p.method, t)} · {p.amount.toLocaleString('en-US')} {t.currency}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

// ── SETTINGS FIELD ROW (top-level so it keeps a stable identity across
// SettingsPage re-renders — being redefined on every keystroke was what
// caused the input to lose focus after a single character) ──
function FieldRow({ label, field, value, setter, ltr, editField, temp, setTemp, startEdit, saveField, t }){
  return (
    <div>
      <label style={{display:'block', fontSize:'.72rem', fontWeight:700, color:'var(--ink-muted)', marginBottom:5}}>{label}</label>
      {editField === field ? (
        <div style={{display:'flex', gap:8}}>
          <div className="field" style={{flex:1, marginBottom:0}}>
            <input value={temp} onChange={e=>setTemp(e.target.value)} style={ltr?{direction:'ltr', textAlign:'left'}:{}}/>
          </div>
          <button className="btn-save-light" onClick={()=>saveField(field, setter)}>{t.save}</button>
        </div>
      ) : (
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span className={ltr?'ltr-nums':''} style={{fontWeight:700}}>{value}</span>
          <button className="btn-edit-light" onClick={()=>startEdit(field, value)}>{t.edit}</button>
        </div>
      )}
    </div>
  );
}

      <div className="settings-group">
        <h4>{t.accountSectionTitle}</h4>
        <div className="settings-card" style={{padding:16, display:'flex', flexDirection:'column', gap:14, marginBottom:10}}>
          <div>
            <label style={{display:'block', fontSize:'.72rem', fontWeight:700, color:'var(--ink-muted)', marginBottom:5}}>{t.emailLabel}</label>
            <div style={{fontSize:'.85rem', color:'var(--ink-muted)'}}>{auth.currentUser?.email}</div>
          </div>
          <FieldRow label={t.loginPhoneLabel} field="phone" value={accountPhone} setter={setAccountPhone} ltr editField={editField} temp={temp} setTemp={setTemp} startEdit={startEdit} saveField={saveField} t={t}/>
        </div>
        <button className="btn-edit-light" style={{width:'100%', padding:'13px', color:'var(--coral)', background:'rgba(232,89,143,0.12)'}} onClick={()=>auth.signOut()}>{t.logoutBtn}</button>
      </div>
    </div>
  );
}

// ── MAIN APP (after login, once account is active) — matches original header/cards/calendar exactly ──
function MainApp({ uid, userDoc, lang, onLangChange }){
  const t = APP_T[lang];
  const [page, setPage] = useState('home');
  const [bookings, setBookings] = useState({});
  const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
  const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
  const [selectedDay, setSelectedDay] = useState(null);
  const [hallName, setHallName] = useState(userDoc.hallName || 'قاعتي');
  const [hallPhone, setHallPhone] = useState(userDoc.hallPhone || userDoc.phone || '');
  const [accountPhone, setAccountPhone] = useState(userDoc.phone || '');
  const [hallAddress, setHallAddress] = useState(userDoc.hallAddress || '');
  const [tagline, setTagline] = useState(userDoc.tagline || 'لتنظيم الأفراح والمناسبات');
  const [badgeLetter, setBadgeLetter] = useState(userDoc.badgeLetter || (userDoc.hallName || 'ق').trim().charAt(0));

  useEffect(() => { setHallName(userDoc.hallName || 'قاعتي'); }, [userDoc.hallName]);

  useEffect(() => {
    const unsub = db.collection('bookings').doc(uid).onSnapshot(snap => {
      setBookings(snap.exists ? (snap.data().data || {}) : {});
    });
    return unsub;
  }, [uid]);

  const saveBookings = useCallback(async (nb) => {
    setBookings(nb);
    await db.collection('bookings').doc(uid).set({ data: nb }, { merge: false });
  }, [uid]);

  const addBooking = (dateKey, { clientName, phone, total, paidNow, method }) => {
    const nb = { ...bookings, [dateKey]: {
      clientName, phone, total,
      payments: paidNow > 0 ? [{ id:'p'+Date.now(), amount: paidNow, date: toKey(new Date()), method }] : [],
    }};
    saveBookings(nb);
    return nb[dateKey]; // hand back the fresh data — bookings state won't reflect it until next render
  };
  const recordPayment = (dateKey, amount, method, paymentDate) => {
    const day = bookings[dateKey];
    if(!day) return null;
    const nb = { ...bookings, [dateKey]: { ...day, payments: [...(day.payments||[]), { id:'p'+Date.now(), amount, date: paymentDate || toKey(new Date()), method }] } };
    saveBookings(nb);
    return nb[dateKey]; // hand back the fresh data — bookings state won't reflect it until next render
  };
  const cancelBooking = (dateKey) => {
    const nb = { ...bookings };
    delete nb[dateKey];
    saveBookings(nb);
  };
  const editBooking = (dateKey, { clientName, phone, total }) => {
    const day = bookings[dateKey];
    if(!day) return;
    const nb = { ...bookings, [dateKey]: { ...day, clientName, phone, total } };
    saveBookings(nb);
  };

  const monthEntries = useMemo(() => {
    return Object.entries(bookings).filter(([dk]) => {
      const d = new Date(dk+'T12:00:00');
      return d.getFullYear()===currentYear && d.getMonth()===currentMonth;
    });
  }, [bookings, currentMonth, currentYear]);

  const monthRevenue = monthEntries.reduce((sum,[,b]) => sum + (b.payments||[]).reduce((a,p)=>a+p.amount,0), 0);
  const notFullyPaid = monthEntries.filter(([,b]) => {
    const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
    return paid < b.total;
  }).length;

  const grid = getMonthGrid(currentYear, currentMonth);
  const todayKey = toKey(new Date());
  const prevMonth = () => { if(currentMonth===0){setCurrentMonth(11);setCurrentYear(y=>y-1);} else setCurrentMonth(m=>m-1); };
  const nextMonth = () => { if(currentMonth===11){setCurrentMonth(0);setCurrentYear(y=>y+1);} else setCurrentMonth(m=>m+1); };

  const dayClass = (dk) => {
    const b = bookings[dk];
    if(!b) return '';
    const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
    return paid < b.total ? 'pending' : 'booked';
  };

  const HomePage = () => (
    <div className="page active" id="page-home">
      <div className="cards" style={{gridTemplateColumns:'1fr 1fr'}}>
        <div className="card">
          <div className="label">{t.monthBookingsRevenueLabel}</div>
          <div className="value">{fmtM(monthRevenue)} {t.currency}</div>
          <div className="sub">{t.fromWord} {monthEntries.length} {t.bookingsCountSuffix}</div>
        </div>
        <div className="card">
          <div className="label">{t.thisMonthBookingsLabel}</div>
          <div className="value">{monthEntries.length}</div>
          <div className="sub">{notFullyPaid} {t.incompletePaymentSuffix}</div>
        </div>
      </div>

      <div className="panel">
        <div className="cal-head">
          <h2>{t.months[currentMonth]} {currentYear}</h2>
          <div className="cal-nav">
            <button onClick={prevMonth} aria-label={t.prevMonthAria}>‹</button>
            <button onClick={nextMonth} aria-label={t.nextMonthAria}>›</button>
          </div>
        </div>
        <div className="weekdays">
          {t.weekdaysShort.map((wd,i) => <span key={i}>{wd}</span>)}
        </div>
        <div className="days">
          {grid.map((d, i) => {
            if(!d) return <div className="day empty" key={i}></div>;
            const dk = toKey(d);
            const cls = ['day', dayClass(dk)];
            if(dk === todayKey) cls.push('today');
            return <div className={cls.join(' ').trim()} key={i} onClick={()=>setSelectedDay(dk)}>{d.getDate()}</div>;
          })}
        </div>
        <div className="legend">
          <span><i className="free"></i> {t.badgeFree}</span>
          <span><i className="pending"></i> {t.badgePending}</span>
          <span><i className="booked"></i> {t.badgeBooked}</span>
        </div>
        <div className="hint-row">{t.calendarHint}</div>
      </div>
    </div>
  );


  // Each overlay (.overlay/.sheet and .print-overlay) already covers the full
  // screen with position:fixed and its own internal scroll, so the page behind
  // it is never visible or reachable — no extra body-freezing needed. An earlier
  // version froze the body's own position here, which caused real problems on
  // some Android browsers (broken single-finger scrolling, overlays failing to
  // paint their content). Removed for that reason.

  const WEEKDAY_NAMES = t.weekdaysFull;

  const openMonthlyExport = (scope) => {
    const entries = Object.entries(bookings)
      .filter(([dk]) => scope === 'all' || dk.slice(0,7) === scope)
      .map(([dk,b]) => ({ dk, ...b }))
      .sort((a,b)=>a.dk.localeCompare(b.dk));
    const title = scope === 'all'
      ? t.pdfAgendaTitleAll
      : (() => { const [y,m]=scope.split('-'); return `${t.pdfAgendaTitleMonthPrefix} ${t.months[parseInt(m,10)-1]} ${y}`; })();
    const rows = entries.map(b => {
      const d = new Date(b.dk+'T12:00:00');
      const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
      const status = paid < b.total ? 'pending' : 'booked';
      return `<tr>
        <td>${d.getDate()} ${t.months[d.getMonth()]}</td>
        <td>${escapeHtml(b.clientName)}</td>
        <td><span class="ltr-nums">${escapeHtml(formatPhone(b.phone))}</span></td>
        <td><span class="status-pill ${status}">${escapeHtml(t.badgeBooked)}</span></td>
      </tr>`;
    }).join('');
    const bodyHtml = `
      <div class="doc-title"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(t.pdfForGuardSubtitle)}</p></div>
      <table>
        <thead><tr><th>${escapeHtml(t.pdfColDate)}</th><th>${escapeHtml(t.pdfColClient)}</th><th>${escapeHtml(t.pdfColPhone)}</th><th>${escapeHtml(t.pdfColStatus)}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="doc-footer">
        <span>${escapeHtml(t.pdfIssuedOn)} ${new Date().toLocaleDateString('en-GB')}</span>
        <span>${escapeHtml(t.brand)}</span>
      </div>`;
    openPrintDoc({ title, hallName, badgeLetter, tagline, hallPhone, hallAddress, bodyHtml, t, lang });
  };

  const openEarningsExport = (scope) => {
    const allPays = [];
    Object.entries(bookings).forEach(([dk, b]) => {
      (b.payments||[]).forEach(p => allPays.push({ ...p, clientName: b.clientName }));
    });
    const filtered = allPays
      .filter(p => scope === 'all' || (p.date||'').slice(0,7) === scope)
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const grandTotal = filtered.reduce((s,p)=>s+p.amount, 0);
    const title = scope === 'all'
      ? t.pdfEarningsTitleAll
      : (() => { const [y,m]=scope.split('-'); return `${t.pdfEarningsTitleMonthPrefix} ${t.months[parseInt(m,10)-1]} ${y}`; })();
    const rows = filtered.map((p,i) => {
      const d = new Date(p.date+'T12:00:00');
      return `<tr>
        <td>${d.getDate()} ${t.months[d.getMonth()]}</td>
        <td>${escapeHtml(p.clientName)}</td>
        <td>${p.amount.toLocaleString('en-US')} ${escapeHtml(t.currency)}</td>
        <td>${escapeHtml(formatPaymentMethod(p.method, t))}</td>
      </tr>`;
    }).join('');
    const bodyHtml = `
      <div class="doc-title"><h2>${escapeHtml(title)}</h2><p>${scope==='all'?escapeHtml(t.pdfSinceStart):escapeHtml(t.pdfThisMonthOnly)}</p></div>
      <table>
        <thead><tr><th>${escapeHtml(t.pdfColDate)}</th><th>${escapeHtml(t.pdfColClient)}</th><th>${escapeHtml(t.pdfColAmountPaid)}</th><th>${escapeHtml(t.pdfColPaymentMethod)}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="display:flex; justify-content:space-between; padding:14px 8px; margin-top:6px; border-top:2px solid #E3E1F2; font-weight:800;">
        <span>${scope==='all'?escapeHtml(t.pdfGrandTotal):escapeHtml(t.pdfMonthTotal)}</span><span>${grandTotal.toLocaleString('en-US')} ${escapeHtml(t.currency)}</span>
      </div>
      <div class="doc-footer">
        <span>${escapeHtml(t.pdfIssuedOn)} ${new Date().toLocaleDateString('en-GB')}</span>
        <span>${escapeHtml(t.brand)}</span>
      </div>`;
    openPrintDoc({ title, hallName, badgeLetter, tagline, hallPhone, hallAddress, bodyHtml, t, lang });
  };

  const openDailyExport = (dateKey) => {
    const dayData = bookings[dateKey];
    if(!dayData) return;
    const d = new Date(dateKey+'T12:00:00');
    const paid = (dayData.payments||[]).reduce((a,p)=>a+p.amount,0);
    const status = paid < dayData.total ? 'pending' : 'booked';
    const title = t.pdfDailyPermitTitle;
    const bodyHtml = `
      <div class="slip">
        <div class="authorize">${escapeHtml(t.pdfDailyPermitTitle)}</div>
        <div class="date-big">${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()}</div>
        <div class="weekday">${WEEKDAY_NAMES[d.getDay()]}</div>
        <div class="slip-row"><span>${escapeHtml(t.pdfColClient)}</span><span>${escapeHtml(dayData.clientName)}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfColPhone)}</span><span class="ltr-nums">${escapeHtml(formatPhone(dayData.phone))}</span></div>
        <div class="badge-big ${status}">${status==='pending'?escapeHtml(t.badgePending):escapeHtml(t.badgeBooked)}</div>
        <div class="note">${escapeHtml(t.pdfPermitNote)}</div>
      </div>`;
    openPrintDoc({ title, hallName, badgeLetter, tagline, hallPhone, hallAddress, bodyHtml, t, lang });
  };

  const openReceipt = (dateKey, paymentIndex, dayDataOverride) => {
    const dayData = dayDataOverride || bookings[dateKey];
    if(!dayData) return;
    const p = (dayData.payments||[])[paymentIndex];
    if(!p) return;
    const d = new Date(dateKey+'T12:00:00');
    const paidSoFar = (dayData.payments||[]).reduce((a,x)=>a+x.amount,0);
    const remaining = dayData.total - paidSoFar;
    const isFull = remaining <= 0;
    const title = t.pdfReceiptTitle;
    const bodyHtml = `
      <div class="doc-title"><h2>${escapeHtml(t.pdfReceiptTitle)}</h2><p>${escapeHtml(p.date)}</p></div>
      <div>
        <div class="slip-row"><span>${escapeHtml(t.pdfColClient)}</span><span>${escapeHtml(dayData.clientName)}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfColPhone)}</span><span class="ltr-nums">${escapeHtml(formatPhone(dayData.phone))}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfEventDate)}</span><span>${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfColPaymentMethod)}</span><span>${escapeHtml(formatPaymentMethod(p.method, t))}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfAmountPaidThisPayment)}</span><span>${p.amount.toLocaleString('en-US')} ${escapeHtml(t.currency)}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfBookingTotalAmount)}</span><span>${dayData.total.toLocaleString('en-US')} ${escapeHtml(t.currency)}</span></div>
        <div class="slip-row"><span>${escapeHtml(t.pdfTotalPaidSoFar)}</span><span>${paidSoFar.toLocaleString('en-US')} ${escapeHtml(t.currency)}</span></div>
        <div class="receipt-highlight ${isFull?'paid-full':'paid-partial'}">
          <div class="rh-label">${isFull?escapeHtml(t.pdfFullyPaid):escapeHtml(t.pdfRemainingAmount)}</div>
          ${!isFull ? `<div class="rh-value">${remaining.toLocaleString('en-US')} ${escapeHtml(t.currency)}</div>` : ''}
        </div>
      </div>`;
    openPrintDoc({ title, hallName, badgeLetter, tagline, hallPhone, hallAddress, bodyHtml, t, lang });
  };

  const dateLabelFor = (dk) => {
    if(!dk) return '';
    const d = new Date(dk+'T12:00:00');
    return `${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()}`;
  };

  return (
    <>
      <div className="bubble b1"></div><div className="bubble b2"></div><div className="bubble b3"></div><div className="bubble b4"></div>

      <header className="hero">
        <div className="avatar-ring">{badgeLetter}</div>
        <h1>{hallName}</h1>
        <p>{tagline}</p>
      </header>

      <main>
        {page === 'home' && <HomePage/>}
        {page === 'agenda' && <AgendaPage bookings={bookings} onSelectDay={setSelectedDay} onExport={openMonthlyExport} t={t}/>}
        {page === 'earnings' && <EarningsPage bookings={bookings} onSelectDay={setSelectedDay} onExport={openEarningsExport} t={t}/>}
        {page === 'settings' && <SettingsPage uid={uid} hallName={hallName} setHallName={setHallName} hallPhone={hallPhone} setHallPhone={setHallPhone} hallAddress={hallAddress} setHallAddress={setHallAddress} tagline={tagline} setTagline={setTagline} badgeLetter={badgeLetter} setBadgeLetter={setBadgeLetter} accountPhone={accountPhone} setAccountPhone={setAccountPhone} lang={lang} onLangChange={onLangChange} t={t}/>}
      </main>

      <div className="bottom-nav">
        <button className={page==='home'?'active':''} onClick={()=>setPage('home')} aria-label={t.navHome}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
        </button>
        <button className={page==='agenda'?'active':''} onClick={()=>setPage('agenda')} aria-label={t.navAgenda}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>
        <button className={page==='earnings'?'active':''} onClick={()=>setPage('earnings')} aria-label={t.navEarnings}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h3.2a1.8 1.8 0 010 3.6h-2a1.8 1.8 0 000 3.6h3.3"/></svg>
        </button>
        <button className={page==='settings'?'active':''} onClick={()=>setPage('settings')} aria-label={t.navSettings}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
        </button>
      </div>

      {selectedDay && (
        <DaySheet
          dateKey={selectedDay}
          dateLabel={dateLabelFor(selectedDay)}
          dayData={bookings[selectedDay]}
          onClose={()=>setSelectedDay(null)}
          onAddBooking={addBooking}
          onRecordPayment={recordPayment}
          onCancel={cancelBooking}
          onEditBooking={editBooking}
          onShare={()=>openDailyExport(selectedDay)}
          onOpenReceipt={(idx, dayDataOverride)=>openReceipt(selectedDay, idx, dayDataOverride)}
          t={t}
        />
      )}
    </>
  );
}

// ── PENDING GATE (account created but not yet activated by admin) ───────
function PendingGate({ whatsapp, t }){
  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-panel active">
          <div className="login-form" style={{textAlign:'center'}}>
            <div style={{fontSize:'2.4rem', marginBottom:6}}>⏳</div>
            <h3 style={{fontSize:'1.05rem', fontWeight:800, color:'var(--teal-dark)', marginBottom:8}}>{t.pendingTitle}</h3>
            <div className="login-note">{t.pendingDesc}</div>
            {whatsapp && (
              <div style={{background:'var(--coral-soft)', borderRadius:16, padding:16, marginBottom:16}}>
                <div style={{fontSize:'.76rem', color:'var(--coral)', fontWeight:700, marginBottom:4}}>{t.pendingContact}</div>
                <div style={{fontSize:'1.05rem', fontWeight:800, color:'var(--ink)'}}>{whatsapp}</div>
              </div>
            )}
            <button type="button" className="btn-secondary" style={{width:'100%'}} onClick={()=>auth.signOut()}>{t.logoutBtn}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── ROOT APP: routes between Auth / Pending / MainApp based on Firebase state ─
function App(){
  const [authUser, setAuthUser] = useState(undefined);
  const [userDoc, setUserDoc] = useState(undefined); // undefined = still loading, null = no account found
  const [whatsapp, setWhatsapp] = useState(''); // empty until Firestore resolves — avoids flashing a fake placeholder number
  const [lang, setLang] = useState(() => localStorage.getItem('qaaty_lang') || 'ar');
  const t = APP_T[lang];

  // Remember whichever language was last chosen — closing the app and
  // reopening it later should pick up right where the person left off,
  // instead of resetting to Arabic every time.
  const onLangChange = (l) => {
    setLang(l);
    localStorage.setItem('qaaty_lang', l);
  };
  useEffect(() => {
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
    document.title = t.brand;
  }, [lang]);

  useEffect(() => {
    const unsub = db.collection('settings').doc('contact').onSnapshot(snap => {
      if(snap.exists && snap.data().whatsapp) setWhatsapp(snap.data().whatsapp);
    }, ()=>{});
    return unsub;
  }, []);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => {
      if(u){
        setAuthUser(u);
        const docUnsub = db.collection('users').doc(u.uid).onSnapshot(snap => {
          setUserDoc(snap.exists ? { id: snap.id, ...snap.data() } : null);
        });
        return docUnsub;
      } else {
        setAuthUser(null);
        setUserDoc(null);
      }
    });
    return unsub;
  }, []);

  // While Firebase is still checking for a persisted session (authUser is
  // undefined), OR the user doc hasn't loaded yet right after signing in
  // (userDoc is undefined), show the same brief spinner instead of the login
  // form or the pending screen — otherwise either one flashes momentarily
  // even when the account is already active, which reads as a real problem
  // even though nothing was actually reset.
  if(authUser === undefined || (authUser && userDoc === undefined)) return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16, background:'linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%)'}}>
      <div style={{width:40, height:40, border:'3px solid var(--teal-deep)', borderTopColor:'transparent', borderRadius:'50%', animation:'spin 0.8s linear infinite'}}></div>
      <div style={{color:'var(--teal-dark)', fontSize:16, fontWeight:800}}>{t.brand}</div>
    </div>
  );
  if(!authUser) return <AuthScreen lang={lang} onLangChange={onLangChange}/>;
  if(!userDoc || !userDoc.active) return <PendingGate whatsapp={whatsapp} t={t}/>;
  return <MainApp uid={authUser.uid} userDoc={userDoc} lang={lang} onLangChange={onLangChange}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
