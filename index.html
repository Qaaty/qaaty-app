<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>قاعتي | لوحة التحكم</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="shortcut icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قاعتي">
<meta name="theme-color" content="#4D48C4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- PINNED VERSIONS — do not change to @latest, this exact combination is tested and working -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

<style>

  :root{
    --mint-1:#DAE1FF;
    --mint-2:#A9B4F5;
    --teal-3:#7B85E8;
    --teal-deep:#4D48C4;
    --teal-dark:#2A2470;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(255,255,255,0.7);
    --ink:#2A2470;
    --ink-muted:#6E68A8;
    --coral:#E8598F;
    --coral-soft:#FBDCE9;
  }
  html{
    min-height:100%;
    background:linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%);
    overflow-x:hidden;
    overscroll-behavior-y:none;
    scrollbar-width:thin;
    scrollbar-color:rgba(77,72,196,.35) transparent;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar{ width:5px; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track{ background:transparent; }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb{ background:rgba(77,72,196,.35); border-radius:10px; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    background:linear-gradient(155deg, var(--mint-1) 0%, var(--mint-2) 45%, var(--teal-3) 100%);
    position:relative;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    padding-bottom:100px;
  }

  .bubble{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.28);
    filter:blur(1px); pointer-events:none; z-index:0;
  }

  /* Phone numbers must stay left-to-right even on an RTL page, or the
     digit groups get visually reordered by the browser's bidi algorithm. */
  .ltr-nums{ direction:ltr; unicode-bidi:embed; display:inline-block; }
  .b1{ width:180px; height:180px; top:-60px; left:-50px; }
  .b2{ width:90px; height:90px; top:120px; right:20px; background:rgba(255,255,255,.35); }
  .b3{ width:260px; height:260px; bottom:60px; right:-100px; background:rgba(255,255,255,.18); }
  .b4{ width:60px; height:60px; top:340px; left:30px; background:rgba(255,255,255,.4); }

  main, header, .owner-row{ position:relative; z-index:1; }

  /* ---------- Header ---------- */
  header.hero{ text-align:center; padding:40px 24px 14px; }
  .avatar-ring{
    width:64px; height:64px; margin:0 auto 14px;
    border-radius:50%;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; font-weight:800; color:var(--teal-deep);
    box-shadow:0 10px 26px rgba(18,61,51,.15);
  }
  .hero h1{ font-size:1.7rem; font-weight:800; color:var(--teal-dark); }
  .hero p{ margin-top:4px; font-size:.85rem; color:var(--ink-muted); }

  .owner-row{
    max-width:900px; margin:18px auto 0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 24px; font-size:.84rem; color:var(--ink-muted);
  }
  .owner-row strong{ color:var(--teal-dark); font-weight:700; }
  .logout{
    color:var(--teal-deep); text-decoration:none;
    font-weight:600; font-size:.8rem;
    background:var(--glass); padding:7px 16px; border-radius:20px;
    border:1px solid var(--glass-border);
  }

  /* ---------- Layout ---------- */
  main{ max-width:900px; margin:0 auto; padding:28px 20px 0; }

  /* ---------- Summary cards ---------- */
  .cards{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:26px;
  }
  .card{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:22px; padding:20px 20px;
    box-shadow:0 16px 34px rgba(18,61,51,.12);
  }
  .card .label{ font-size:.78rem; color:var(--ink-muted); font-weight:500; }
  .card .value{ font-size:1.5rem; font-weight:800; margin-top:8px; color:var(--teal-dark); font-variant-numeric:tabular-nums; }
  .card .sub{ font-size:.72rem; color:var(--ink-muted); margin-top:5px; }
  .card.accent .value{ color:var(--coral); }

  .panel{
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:26px; padding:24px;
    box-shadow:0 16px 34px rgba(18,61,51,.12);
  }

  /* ---------- Calendar ---------- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-head h2{ color:var(--teal-dark); font-size:1.2rem; font-weight:800; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:30px; height:30px; border-radius:50%;
    border:none; background:var(--glass-strong);
    color:var(--teal-deep); font-size:1rem; cursor:pointer;
  }
  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; }
  .weekdays span{ text-align:center; font-size:.72rem; color:var(--ink-muted); font-weight:700; padding-bottom:6px; }
  .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .day{
    aspect-ratio:1/1; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:700; color:var(--ink);
    background:rgba(255,255,255,0.35);
    border:1px solid transparent; cursor:pointer;
    transition:transform .12s ease;
  }
  .day:hover{ transform:translateY(-2px); }
  .day.empty{ background:transparent; cursor:default; }
  .day.empty:hover{ transform:none; }
  .day.today{ border-color:var(--teal-deep); }
  .day.booked{ color:#fff; background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); box-shadow:0 8px 18px rgba(30,122,99,.35); }
  .day.pending{ color:var(--coral); background:var(--coral-soft); border:1.5px dashed var(--coral); }
  .day.selected{ outline:2px solid var(--teal-dark); outline-offset:2px; }

  .legend{ display:flex; gap:18px; margin-top:20px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-muted); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend i{ width:12px; height:12px; border-radius:5px; display:inline-block; }
  .legend i.booked{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); }
  .legend i.pending{ background:var(--coral-soft); border:1.5px dashed var(--coral); }
  .legend i.free{ background:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,.6); }

  .hint-row{
    display:flex; align-items:center; gap:8px;
    margin-top:16px; padding:12px 14px;
    background:rgba(255,255,255,.3); border-radius:14px;
    font-size:.76rem; color:var(--ink-muted);
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px;
    background:var(--glass-strong);
    backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:30px; padding:10px 18px;
    box-shadow:0 16px 34px rgba(18,61,51,.18);
    z-index:2;
  }
  .bottom-nav button{
    width:40px; height:40px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted); cursor:pointer;
  }
  .bottom-nav button.active{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }
  .bottom-nav svg{ width:19px; height:19px; }

  @media (max-width: 760px){ .cards{ grid-template-columns:1fr; } }

  /* ---------- Bottom sheets (shared) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(42,36,112,0.35);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:none; align-items:flex-end; justify-content:center;
    z-index:10;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    background:linear-gradient(165deg, #6259D6, #4A42B0);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:28px 28px 0 0;
    padding:22px 22px 28px;
    box-shadow:0 -20px 50px rgba(42,36,112,.4);
    animation:sheetUp .22s ease-out;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.3) transparent;
  }
  .sheet::-webkit-scrollbar{ width:5px; }
  .sheet::-webkit-scrollbar-track{ background:transparent; }
  .sheet::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.3); border-radius:10px; }
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,0.25); margin:0 auto 16px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .sheet-head h3{ font-size:1.15rem; font-weight:800; color:#F1EEFB; }
  .sheet-close{
    width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.14); color:#F1EEFB; font-size:1rem; cursor:pointer;
  }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.78rem; font-weight:700; color:#D6D1F5; margin-bottom:7px; }
  .field input, .field select{
    width:100%; font-family:'Tajawal', sans-serif; font-size:.9rem; color:var(--ink);
    background:rgba(255,255,255,0.92);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:14px; padding:12px 14px; outline:none;
  }
  .field input:focus, .field select:focus{ border-color:#fff; background:#fff; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .sheet-actions{ display:flex; gap:10px; margin-top:22px; }
  .btn-primary{
    flex:1; background:#fff;
    color:var(--teal-deep); border:none; border-radius:16px; padding:14px;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.9rem; cursor:pointer;
    box-shadow:0 12px 26px rgba(0,0,0,.2);
  }
  .btn-secondary{
    background:rgba(255,255,255,0.14); color:#F1EEFB; border:none;
    border-radius:16px; padding:14px 20px;
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:.9rem; cursor:pointer;
  }
  .btn-ghost{
    width:100%; background:none; border:1.5px dashed rgba(255,255,255,0.5);
    color:#F1EEFB; border-radius:16px; padding:14px;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:.88rem; cursor:pointer;
  }

  /* ---------- Day details sheet ---------- */
  .ds-title{ font-size:1.1rem; font-weight:800; color:#F1EEFB; margin-bottom:2px; }
  .ds-date{ font-size:.78rem; color:#D6D1F5; margin-bottom:14px; }
  .form-error{
    background:rgba(232,89,143,0.18); color:#FBD9E6; font-size:.78rem; font-weight:700;
    padding:10px 14px; border-radius:12px; margin-bottom:14px;
  }
  .form-success{
    background:rgba(30,122,99,0.18); color:#B7F0DC; font-size:.78rem; font-weight:700;
    padding:10px 14px; border-radius:12px; margin-bottom:14px;
  }
  .date-field{
    direction:ltr; position:relative; display:flex; align-items:center; justify-content:space-between;
    width:100%; background:rgba(255,255,255,0.92); border:1px solid rgba(255,255,255,0.2);
    border-radius:14px; padding:12px 14px; color:var(--ink-muted);
  }
  .date-field-icon-btn{ background:none; border:none; padding:0; display:flex; color:var(--ink-muted); cursor:pointer; }
  .date-field-values{ display:flex; align-items:center; gap:6px; }
  .date-field input{
    width:34px; border:none; background:none; outline:none; padding:0;
    font-family:'Tajawal', sans-serif; font-size:.9rem; color:var(--ink); text-align:center;
    -moz-appearance:textfield;
  }
  .date-field input::-webkit-outer-spin-button, .date-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .date-picker-popup{
    position:absolute; top:calc(100% + 8px); left:0; z-index:20;
    width:260px; background:#fff; border-radius:16px; padding:14px;
    box-shadow:0 16px 36px rgba(18,61,51,.25); direction:ltr;
  }
  .date-picker-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .date-picker-nav button{ background:var(--glass); border:none; width:28px; height:28px; border-radius:50%; color:var(--teal-deep); font-size:1rem; }
  .date-picker-nav span{ font-size:.84rem; font-weight:800; color:var(--ink); }
  .date-picker-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
  .date-picker-weekdays span{ text-align:center; font-size:.62rem; font-weight:700; color:var(--ink-muted); }
  .date-picker-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .date-picker-grid button{
    aspect-ratio:1/1; border:none; border-radius:8px; background:var(--bg,#F3F2FF);
    font-size:.76rem; font-weight:700; color:var(--ink); font-family:'Tajawal', sans-serif;
  }
  .date-picker-grid button.selected{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; }
  .date-picker-backdrop{ position:fixed; inset:0; z-index:19; }
  .date-field span{ color:var(--ink-muted); font-size:.85rem; }
  .badge{ display:inline-block; padding:5px 14px; border-radius:20px; font-size:.72rem; font-weight:700; margin-bottom:16px; }
  .badge.booked{ background:rgba(255,255,255,0.18); color:#DFFAF0; }
  .badge.pending{ background:rgba(255,255,255,0.9); color:var(--coral); }
  .badge.free{ background:rgba(255,255,255,0.16); color:#EDEBFA; }

  .info-row{
    display:flex; justify-content:space-between; padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,0.14); font-size:.84rem;
  }
  .info-row span:first-child{ color:#D6D1F5; }
  .info-row span:last-child{ font-weight:700; color:#FDFCFF; }

  .deposit-bar{ margin-top:16px; margin-bottom:6px; background:rgba(255,255,255,.18); border-radius:20px; height:8px; overflow:hidden; }
  .deposit-fill{ height:100%; background:#fff; border-radius:20px; }
  .deposit-caption{ font-size:.72rem; color:#D6D1F5; display:flex; justify-content:space-between; }

  .empty-state{ text-align:center; padding:36px 10px; color:#D6D1F5; font-size:.84rem; line-height:1.8; }

  .ds-section-title{
    font-size:.78rem; font-weight:800; color:#D6D1F5;
    margin:22px 0 10px;
  }
  .payment-history{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .payment-row{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.14); border-radius:14px; padding:10px 14px;
  }
  .payment-row .p-date{ font-size:.78rem; color:#D6D1F5; }
  .payment-row .p-amount{ font-size:.86rem; font-weight:800; color:#FDFCFF; }
  .receipt-icon-btn{
    width:26px; height:26px; border-radius:50%; border:none; flex-shrink:0;
    background:rgba(255,255,255,0.14); color:#F1EEFB; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .receipt-icon-btn svg{ width:13px; height:13px; }

  .inline-payment{
    margin-top:16px; padding:16px; background:rgba(255,255,255,0.1);
    border-radius:18px; border:1px dashed rgba(255,255,255,0.4);
  }
  .inline-payment .ip-label{ font-size:.78rem; font-weight:700; color:#F1EEFB; margin-bottom:10px; }
  .inline-payment .field-row{ align-items:end; }
  .inline-payment button{
    width:100%; margin-top:10px;
    background:var(--coral); color:#fff; border:none; border-radius:14px;
    padding:12px; font-family:'Tajawal', sans-serif; font-weight:800; font-size:.86rem; cursor:pointer;
  }

  /* ---------- Record payment sheet ---------- */
  .remaining-box{
    background:var(--coral-soft);
    border-radius:16px; padding:16px 18px; text-align:center; margin-bottom:18px;
  }
  .remaining-box .r-label{ font-size:.76rem; color:var(--coral); font-weight:700; }
  .remaining-box .r-value{ font-size:1.5rem; font-weight:800; color:var(--coral); margin-top:4px; }
  .btn-pay-full{
    background:none; border:none; color:#EDEBFA;
    font-family:'Tajawal', sans-serif; font-size:.78rem; font-weight:700;
    text-decoration:underline; cursor:pointer; padding:0; margin-top:8px;
  }

  /* ---------- Agenda ---------- */
  .search-row{ display:flex; gap:10px; margin-bottom:14px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:10px 14px;
  }
  .search-box svg{ width:16px; height:16px; color:var(--ink-muted); flex-shrink:0; }
  .search-box input{
    border:none; background:transparent; outline:none;
    font-family:'Tajawal', sans-serif; font-size:.84rem; color:var(--ink); width:100%;
  }
  .month-select{
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:10px 12px;
    font-family:'Tajawal', sans-serif; font-size:.8rem; color:var(--ink); font-weight:700;
  }

  .filter-chips{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--glass-border); background:var(--glass); color:var(--ink-muted);
    font-family:'Tajawal', sans-serif; font-size:.78rem; font-weight:700;
    padding:8px 16px; border-radius:20px; cursor:pointer;
  }
  .chip.active{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); color:#fff; border-color:transparent; }

  .agenda-list{ display:flex; flex-direction:column; gap:12px; }
  .agenda-item{
    display:flex; align-items:center; gap:14px;
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:20px; padding:14px 16px;
    box-shadow:0 12px 28px rgba(18,61,51,.1); cursor:pointer;
  }
  .agenda-date{
    flex-shrink:0; width:52px; height:52px; border-radius:14px;
    background:var(--glass-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--teal-dark);
  }
  .agenda-date .num{ font-size:1.05rem; font-weight:800; line-height:1; }
  .agenda-date .mon{ font-size:.62rem; color:var(--ink-muted); margin-top:2px; }
  .agenda-item.booked .agenda-date{ background:linear-gradient(150deg, var(--teal-3), var(--teal-deep)); }
  .agenda-item.booked .agenda-date .num, .agenda-item.booked .agenda-date .mon{ color:#fff; }
  .agenda-item.pending .agenda-date{ background:var(--coral-soft); }
  .agenda-item.pending .agenda-date .num, .agenda-item.pending .agenda-date .mon{ color:var(--coral); }

  .agenda-info{ flex:1; min-width:0; }
  .agenda-info .name{ font-size:.9rem; font-weight:800; color:var(--ink); }
  .agenda-info .meta{ font-size:.76rem; color:var(--ink-muted); margin-top:3px; }
  .agenda-status{ flex-shrink:0; font-size:.7rem; font-weight:700; padding:5px 12px; border-radius:16px; }
  .agenda-item.booked .agenda-status{ background:rgba(30,122,99,0.15); color:var(--teal-deep); }
  .agenda-item.pending .agenda-status{ background:var(--coral-soft); color:var(--coral); }

  /* ---------- Earnings: month cards & detail ---------- */
  .month-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border); border-radius:22px; padding:20px 20px;
    box-shadow:0 14px 32px rgba(18,61,51,.12); cursor:pointer;
  }
  .month-card .mc-name{ font-size:1rem; font-weight:800; color:var(--teal-dark); }
  .month-card .mc-sub{ font-size:.76rem; color:var(--ink-muted); margin-top:4px; }

// ── AUTH SCREEN ──────────────────────────────────────────────────────────
function AuthScreen({ lang, onLangChange }){
  const [panel, setPanel] = useState('auth'); // auth | pending | forgot
  const [mode, setMode] = useState('login'); // login | signup
  const [loginPhone, setLoginPhone] = useState('');
  const [loginPassword, setLoginPassword] = useState('');
  const [showLoginPass, setShowLoginPass] = useState(false);
  const [signupHallName, setSignupHallName] = useState('');
  const [signupPhone, setSignupPhone] = useState('');
  const [signupEmail, setSignupEmail] = useState('');
  const [signupPassword, setSignupPassword] = useState('');
  const [showSignupPass, setShowSignupPass] = useState(false);
  const [signupPasswordConfirm, setSignupPasswordConfirm] = useState('');
  const [showSignupPassConfirm, setShowSignupPassConfirm] = useState(false);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [whatsapp, setWhatsapp] = useState('+222 XX XX XX XX');
  const t = LOGIN_T[lang];
  // Text direction (dir/lang on <html>) is now handled once, globally, at the
  // App root — so it stays in sync everywhere, not just on this screen.

  const EyeIcon = ({ shown }) => shown ? (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>

  );

  useEffect(() => {
    db.collection('settings').doc('contact').get().then(snap => {
      if(snap.exists && snap.data().whatsapp) setWhatsapp(snap.data().whatsapp);
    }).catch(()=>{});
  }, []);

  const handleLogin = async () => {
    setError('');
    if(!loginPhone.trim() || !loginPassword) return setError(t.errorGeneral);
    setLoading(true);
    try {
      // Phone is the identifier users type, but Firebase Auth needs an email under the hood.
      // We look up the account's email by phone number in Firestore first.
      const q = await db.collection('users').where('phone', '==', loginPhone.trim()).limit(1).get();
      if(q.empty){ setError(t.errorWrong); setLoading(false); return; }
      const userEmail = q.docs[0].data().email;
      await auth.signInWithEmailAndPassword(userEmail, loginPassword);
    } catch(e) {
      setError(t.errorWrong);
    }
    setLoading(false);
  };

  const handleSignup = async () => {
    setError('');
    if(!signupHallName.trim()) return setError(t.errorName);
    if(!signupPhone.trim()) return setError(t.errorGeneral);
    if(!signupEmail.includes('@')) return setError(t.errorEmail);
    if(signupPassword.length < 6) return setError(t.errorPassword);
    if(signupPassword !== signupPasswordConfirm) return setError(t.errorMatch);
    setLoading(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(signupEmail.trim(), signupPassword);
      await db.collection('users').doc(cred.user.uid).set({
        hallName: signupHallName.trim(),
        phone: signupPhone.trim(),
        email: signupEmail.trim().toLowerCase(),
        active: false,
        createdAt: new Date().toISOString(),
        price: 1500,
      });
      setPanel('pending');
    } catch(e) {
      if(e.code === 'auth/email-already-in-use') setError(t.errorExists);
      else setError(t.errorGeneral);
    }
    setLoading(false);
  };

  const inp = { width:'100%' };

  if(panel === 'pending'){
    return (
      <div className="login-screen">
        <div className="login-card">
          <div className="login-lang-switch">
            {['ar','fr','en'].map(l => (
              <button key={l} className={lang===l?'active':''} onClick={()=>onLangChange(l)}>
                {l==='ar'?'🇲🇷 AR':l==='fr'?'🇫🇷 FR':'🇬🇧 EN'}
              </button>
            ))}
          </div>
          <div className="login-panel active">
            <div className="login-form" style={{textAlign:'center'}}>
              <div style={{fontSize:'2.4rem', marginBottom:6}}>⏳</div>
              <h3 style={{fontSize:'1.05rem', fontWeight:800, color:'var(--teal-dark)', marginBottom:8}}>{t.pendingTitle}</h3>
              <div className="login-note">{t.pendingDesc}</div>
              <div style={{background:'var(--coral-soft)', borderRadius:16, padding:16, marginBottom:16}}>
                <div style={{fontSize:'.76rem', color:'var(--coral)', fontWeight:700, marginBottom:4}}>{t.pendingContact}</div>
                <div style={{fontSize:'1.05rem', fontWeight:800, color:'var(--ink)'}}>{whatsapp}</div>
              </div>
              <button type="button" className="btn-secondary" style={{width:'100%'}} onClick={()=>{auth.signOut();setPanel('auth');}}>{t.backToLogin}</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if(panel === 'forgot'){
    return (
      <div className="login-screen">
        <div className="login-card">
          <div className="login-lang-switch">
            {['ar','fr','en'].map(l => (
              <button key={l} className={lang===l?'active':''} onClick={()=>onLangChange(l)}>
                {l==='ar'?'🇲🇷 AR':l==='fr'?'🇫🇷 FR':'🇬🇧 EN'}
              </button>
            ))}
          </div>
          <div className="login-panel active">
            <div className="login-form">
              <div style={{fontSize:'1rem', fontWeight:800, color:'var(--teal-dark)', marginBottom:16}}>{t.forgotHeading}</div>
              <div style={{background:'var(--glass-strong)', borderRadius:16, padding:20, textAlign:'center', marginBottom:16}}>
                <div style={{fontSize:'1.8rem', marginBottom:8}}>📞</div>
                <div className="login-note" style={{marginBottom:12}}>{t.forgotDesc}</div>
                <div style={{fontSize:'.85rem', fontWeight:700, color:'var(--teal-deep)'}}>WhatsApp</div>
                <div style={{fontSize:'1.15rem', fontWeight:800, color:'var(--ink)', marginTop:4}}>{whatsapp}</div>
              </div>
              <button type="button" className="btn-secondary" style={{width:'100%'}} onClick={()=>setPanel('auth')}>{t.backToLogin}</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-lang-switch">
          {['ar','fr','en'].map(l => (
            <button key={l} className={lang===l?'active':''} onClick={()=>onLangChange(l)}>
              {l==='ar'?'🇲🇷 AR':l==='fr'?'🇫🇷 FR':'🇬🇧 EN'}
            </button>
          ))}
        </div>

        <div className="login-guide">
          {[t.guideStep1, t.guideStep2, t.guideStep3].map((s,i) => (
            <div className="lg-step" key={i}>
              <div className="lg-num">{i+1}</div>
              <div className="lg-text">{s}</div>
            </div>
          ))}
        </div>
        <div className="login-contact-card">
          <div className="lcc-label">{t.contactLabel}</div>
          <div className="lcc-number">WhatsApp: {whatsapp}</div>
        </div>

        <div className="login-avatar" style={{background:'none'}}>
          <svg viewBox="0 0 512 512" width="40" height="40"><defs><linearGradient id="bgLoginApp" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#8791E8"/><stop offset="100%" stopColor="#4D48C4"/></linearGradient></defs><rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgLoginApp)"/><rect x="175" y="54" width="26" height="56" rx="13" fill="#FFFFFF"/><rect x="311" y="54" width="26" height="56" rx="13" fill="#FFFFFF"/><rect x="96" y="118" width="320" height="290" rx="32" fill="#FFFFFF"/><path d="M128,118 L384,118 A32,32 0 0 1 416,150 L416,198 L96,198 L96,150 A32,32 0 0 1 128,118 Z" fill="#4D48C4"/><circle cx="256" cy="303" r="62" fill="#E8598F"/><path d="M228,304 L248,324 L288,280" fill="none" stroke="#FFFFFF" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
        <h1>{t.brand}</h1>
        <p>{t.tagline}</p>

        <div className="login-panel active">
          <div className="login-tabs">
            <button className={mode==='login'?'active':''} onClick={()=>{setMode('login');setError('');}}>{t.tabLogin}</button>
            <button className={mode==='signup'?'active':''} onClick={()=>{setMode('signup');setError('');}}>{t.tabSignup}</button>
          </div>

          {error && <div style={{background:'var(--coral-soft)', color:'var(--coral)', fontSize:'.8rem', fontWeight:700, padding:'10px 14px', borderRadius:12, marginBottom:14}}>{error}</div>}

          {mode === 'login' ? (
            <form className="login-form" onSubmit={e=>{e.preventDefault();handleLogin();}}>
              <div className="field">
                <label>{t.fieldPhone}</label>
                <input style={inp} type="tel" value={loginPhone} onChange={e=>setLoginPhone(e.target.value)} required/>
              </div>
              <div className="field">
                <label>{t.fieldPassword}</label>
                <div style={{position:'relative'}}>
                  <input style={{...inp, paddingInlineEnd:44}} type={showLoginPass?'text':'password'} value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} required/>

            <form className="login-form" onSubmit={e=>{e.preventDefault();handleSignup();}}>

              <div className="field">

                <input style={inp} type="tel" value={signupPhone} onChange={e=>setSignupPhone(e.target.value)} required/>
              </div>
              <div className="field">
                <label>{t.fieldEmail}</label>
                <input style={inp} type="email" value={signupEmail} onChange={e=>setSignupEmail(e.target.value)} required/>
              </div>
              <div className="field">
                <label>{t.fieldPassword}</label>
                <div style={{position:'relative'}}>
                  <input style={{...inp, paddingInlineEnd:44}} type={showSignupPass?'text':'password'} value={signupPassword} onChange={e=>setSignupPassword(e.target.value)} required/>
                  <button type="button" onClick={()=>setShowSignupPass(v=>!v)} style={{position:'absolute', insetInlineEnd:14, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', padding:0, color:'var(--ink-muted)', display:'flex'}}>
                    <EyeIcon shown={showSignupPass}/>
                  </button>
                </div>
              </div>
              <div className="field">
                <label>{t.fieldPasswordConfirm}</label>
                <div style={{position:'relative'}}>
                  <input style={{...inp, paddingInlineEnd:44}} type={showSignupPassConfirm?'text':'password'} value={signupPasswordConfirm} onChange={e=>setSignupPasswordConfirm(e.target.value)} required/>
                  <button type="button" onClick={()=>setShowSignupPassConfirm(v=>!v)} style={{position:'absolute', insetInlineEnd:14, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', padding:0, color:'var(--ink-muted)', display:'flex'}}>
                    <EyeIcon shown={showSignupPassConfirm}/>
                  </button>
                </div>
              </div>
              <button type="submit" className="login-submit" disabled={loading}>{loading?t.loading:t.btnSignup}</button>
            </form>
          )}
          {mode === 'login' && (
            <a href="#" className="login-forgot" onClick={e=>{e.preventDefault();setPanel('forgot');}}>{t.forgotLink}</a>
          )}
        </div>
      </div>
    </div>
  );
}


// Custom date field — the browser's native date picker renders its own OS
// language and layout (e.g. showing month names in English regardless of app
// language). This gives full control: always numeric DD/MM/YYYY, and a real
// calendar picker button alongside direct number entry.
function DateField({ value, onChange }){
  const [y, m, d] = value.split('-').map(Number);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [pickerMonth, setPickerMonth] = useState(m-1);
  const [pickerYear, setPickerYear] = useState(y);

  const set = (day, month, year) => {
    const dd = String(Math.min(31, Math.max(1, day))).padStart(2,'0');
    const mm = String(Math.min(12, Math.max(1, month))).padStart(2,'0');
    const yyyy = String(year).padStart(4,'0');
    onChange(`${yyyy}-${mm}-${dd}`);
  };

  const openPicker = () => { setPickerMonth(m-1); setPickerYear(y); setPickerOpen(true); };
  const grid = getMonthGrid(pickerYear, pickerMonth);
  const prevMonth = () => { if(pickerMonth===0){setPickerMonth(11);setPickerYear(yr=>yr-1);} else setPickerMonth(mo=>mo-1); };
  const nextMonth = () => { if(pickerMonth===11){setPickerMonth(0);setPickerYear(yr=>yr+1);} else setPickerMonth(mo=>mo+1); };

  return (
    <div className="date-field">
      <button type="button" className="date-field-icon-btn" onClick={()=>pickerOpen ? setPickerOpen(false) : openPicker()}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
      <div className="date-field-values">
        <input type="number" min="1" max="31" value={d} onChange={e=>set(Number(e.target.value)||1, m, y)}/>
        <span>/</span>
        <input type="number" min="1" max="12" value={m} onChange={e=>set(d, Number(e.target.value)||1, y)}/>
        <span>/</span>
        <input type="number" min="2020" max="2100" value={y} onChange={e=>set(d, m, Number(e.target.value)||y)} style={{width:52}}/>
      </div>

      {pickerOpen && (
        <>
          <div className="date-picker-backdrop" onClick={()=>setPickerOpen(false)}></div>
          <div className="date-picker-popup" onClick={e=>e.stopPropagation()}>
            <div className="date-picker-nav">
              <button type="button" onClick={prevMonth}>‹</button>
              <span>{MONTH_NAMES[pickerMonth]} {pickerYear}</span>
              <button type="button" onClick={nextMonth}>›</button>
            </div>
            <div className="date-picker-weekdays">
              <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>
            <div className="date-picker-grid">
              {grid.map((dt, i) => {
                if(!dt) return <div key={i}></div>;
                const isSelected = dt.getDate()===d && dt.getMonth()===m-1 && dt.getFullYear()===y;
                return (
                  <button type="button" key={i} className={isSelected?'selected':''} onClick={()=>{
                    set(dt.getDate(), dt.getMonth()+1, dt.getFullYear());
                    setPickerOpen(false);
                  }}>{dt.getDate()}</button>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ── DAY SHEET (matches original .overlay/.sheet/.badge/.deposit-bar design exactly) ──
function DaySheet({ dateKey, dateLabel, dayData, onClose, onAddBooking, onRecordPayment, onCancel, onShare, onOpenReceipt, onEditBooking }){
  const [screen, setScreen] = useState(dayData ? 'view' : 'empty');
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [total, setTotal] = useState('');
  const [paidNow, setPaidNow] = useState('');
  const [payAmount, setPayAmount] = useState('');
  const [payMethod, setPayMethod] = useState('نقدا');
  const [payDate, setPayDate] = useState(toKey(new Date()));
  const [payError, setPayError] = useState('');
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [addError, setAddError] = useState('');
  const [editName, setEditName] = useState('');
  const [editPhone, setEditPhone] = useState('');
  const [editTotal, setEditTotal] = useState('');
  const [editError, setEditError] = useState('');
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const dragStartY = React.useRef(0);

  const handleTouchStart = (e) => {
    dragStartY.current = e.touches[0].clientY;
    setDragging(true);
  };
  const handleTouchMove = (e) => {
    if(!dragging) return;
    const delta = e.touches[0].clientY - dragStartY.current;
    if(delta > 0) setDragY(delta); // only allow dragging downward
  };
  const handleTouchEnd = () => {
    setDragging(false);
    if(dragY > 90){ onClose(); } // dragged down far enough — dismiss
    setDragY(0);
  };

  const paid = dayData ? (dayData.payments||[]).reduce((a,p)=>a+p.amount,0) : 0;
  const remaining = dayData ? dayData.total - paid : 0;
  const pct = dayData ? Math.round((paid / dayData.total) * 100) : 0;
  const status = remaining > 0 ? 'pending' : 'booked';
  const sortedPayments = dayData ? [...(dayData.payments||[])].sort((a,c)=>a.date.localeCompare(c.date)) : [];

  return (
    <div className="overlay open">
      <div
        className="sheet"
        style={{ transform:`translateY(${dragY}px)`, transition: dragging ? 'none' : 'transform .25s ease' }}
      >
        <div
          style={{ cursor:'grab' }}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
        >
          <div className="sheet-handle"></div>
          <div className="sheet-head">
            <h3>{dayData ? dayData.clientName : dateLabel}</h3>

        {screen === 'add' && !dayData && (
          <form onSubmit={e=>{
            e.preventDefault();
            if(!name.trim() || !phone.trim() || !total){ setAddError('يرجى تعبئة كل الحقول المطلوبة.'); return; }

            </div>

            {remaining > 0 && <button className="btn-primary" style={{width:'100%', marginTop:16}} onClick={()=>setScreen('pay')}>+ تسجيل دفعة</button>}
            <button className="btn-secondary" style={{width:'100%', marginTop:10}} onClick={onShare}>مشاركة مع الزبون</button>

            {!confirmCancel ? (
              <div style={{display:'flex', gap:10, marginTop:10}}>
                <button className="btn-secondary" style={{flex:1}} onClick={()=>{
                  setEditName(dayData.clientName); setEditPhone(dayData.phone); setEditTotal(String(dayData.total));
                  setScreen('edit');
                }}>تعديل التفاصيل</button>
                <button className="btn-secondary" style={{flex:1, background:'rgba(232,89,143,0.18)', color:'#FBD9E6'}} onClick={()=>setConfirmCancel(true)}>إلغاء الحجز</button>
              </div>
            ) : (
              <div className="sheet-actions" style={{marginTop:10}}>
                <button className="btn-secondary" onClick={()=>setConfirmCancel(false)}>تراجع</button>
                <button className="btn-primary" style={{background:'var(--coral)'}} onClick={()=>{onCancel(dateKey); onClose();}}>تأكيد الإلغاء</button>
              </div>
            )}
          </>
        )}

        {screen === 'edit' && dayData && (
          <form onSubmit={e=>{
            e.preventDefault();
            const newTotal = Number(editTotal);
            if(!editName.trim() || !editPhone.trim() || !newTotal) return;
            if(newTotal < paid){ setEditError(`لا يمكن أن يكون المبلغ الإجمالي أقل من المدفوع بالفعل (${paid.toLocaleString('en-US')} اوقية)`); return; }
            onEditBooking(dateKey, { clientName:editName.trim(), phone:editPhone.trim(), total:newTotal });
            setEditError('');
            setScreen('view');
          }}>
            {editError && <div className="form-error">{editError}</div>}
            <div className="field"><label>اسم الزبون</label><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} required/></div>
            <div className="field"><label>رقم الهاتف</label><input type="tel" value={editPhone} onChange={e=>setEditPhone(e.target.value)} required/></div>
            <div className="field"><label>المبلغ الإجمالي (اوقية)</label><input type="number" min="0" value={editTotal} onChange={e=>setEditTotal(e.target.value)} required/></div>
            <div className="sheet-actions">
              <button type="button" className="btn-secondary" onClick={()=>{setEditError('');setScreen('view');}}>إلغاء</button>
              <button type="submit" className="btn-primary">حفظ التعديلات</button>
            </div>
          </form>
        )}

        {screen === 'pay' && dayData && (
          <>
            <div className="remaining-box">
              <div className="r-label">المبلغ المتبقي</div>
              <div className="r-value">{remaining.toLocaleString('en-US')} اوقية</div>
            </div>
            <form onSubmit={e=>{
              e.preventDefault();
              const amt = Number(payAmount);
              if(!amt || amt <= 0){ setPayError('يرجى إدخال مبلغ صحيح.'); return; }
              if(amt > remaining){ setPayError(`المبلغ أكبر من المتبقي (${remaining.toLocaleString('en-US')} اوقية).`); return; }
              const newPaymentIndex = (dayData.payments||[]).length; // index the new payment will occupy
              onRecordPayment(dateKey, amt, payMethod, payDate);
              setPayAmount(''); setPayError('');
              setScreen('view');
              onOpenReceipt(newPaymentIndex);
            }}>
              {payError && <div className="form-error">{payError}</div>}
              <div className="field">
                <label>المبلغ المدفوع الآن (اوقية)</label>
                <input type="number" value={payAmount} onChange={e=>{setPayAmount(e.target.value);setPayError('');}} min="1" required/>
                <button type="button" className="btn-pay-full" onClick={()=>{setPayAmount(String(remaining));setPayError('');}}>تسديد كامل المبلغ المتبقي</button>
              </div>
              <div className="field">
                <label>تاريخ الدفعة</label>
                <DateField value={payDate} onChange={setPayDate}/>
              </div>
              <div className="field">
                <label>طريقة الدفع</label>
                <select value={payMethod} onChange={e=>setPayMethod(e.target.value)}>
                  <option value="نقدا">نقدا</option>
                  <option value="Bankily">Bankily</option>
                  <option value="Masrvi">Masrvi</option>
                  <option value="Sedad">Sedad</option>
                  <option value="أخرى">أخرى</option>
                </select>
              </div>
              <div className="sheet-actions">
                <button type="button" className="btn-secondary" onClick={()=>{setPayError('');setScreen('view');}}>إلغاء</button>
                <button type="submit" className="btn-primary">تأكيد الدفعة</button>
              </div>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP (after login, once account is active) — matches original header/cards/calendar exactly ──
function MainApp({ uid, userDoc, lang, onLangChange }){
  const [page, setPage] = useState('home');
  const [bookings, setBookings] = useState({});
  const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
  const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
  const [selectedDay, setSelectedDay] = useState(null);
  const [hallName, setHallName] = useState(userDoc.hallName || 'قاعتي');
  const [hallPhone, setHallPhone] = useState(userDoc.hallPhone || userDoc.phone || '');
  const [hallAddress, setHallAddress] = useState(userDoc.hallAddress || '');
  const [tagline, setTagline] = useState(userDoc.tagline || 'لتنظيم الأفراح والمناسبات');
  const [badgeLetter, setBadgeLetter] = useState(userDoc.badgeLetter || (userDoc.hallName || 'ق').trim().charAt(0));

  useEffect(() => { setHallName(userDoc.hallName || 'قاعتي'); }, [userDoc.hallName]);

  useEffect(() => {
    const unsub = db.collection('bookings').doc(uid).onSnapshot(snap => {
      setBookings(snap.exists ? (snap.data().data || {}) : {});
    });
    return unsub;
  }, [uid]);

  const saveBookings = useCallback(async (nb) => {
    setBookings(nb);
    await db.collection('bookings').doc(uid).set({ data: nb }, { merge: false });
  }, [uid]);

  const addBooking = (dateKey, { clientName, phone, total, paidNow, method }) => {
    const nb = { ...bookings, [dateKey]: {
      clientName, phone, total,
      payments: paidNow > 0 ? [{ id:'p'+Date.now(), amount: paidNow, date: toKey(new Date()), method }] : [],
    }};
    saveBookings(nb);
  };
  const recordPayment = (dateKey, amount, method, paymentDate) => {
    const day = bookings[dateKey];
    if(!day) return;
    const nb = { ...bookings, [dateKey]: { ...day, payments: [...(day.payments||[]), { id:'p'+Date.now(), amount, date: paymentDate || toKey(new Date()), method }] } };
    saveBookings(nb);
  };
  const cancelBooking = (dateKey) => {
    const nb = { ...bookings };
    delete nb[dateKey];
    saveBookings(nb);
  };
  const editBooking = (dateKey, { clientName, phone, total }) => {
    const day = bookings[dateKey];
    if(!day) return;
    const nb = { ...bookings, [dateKey]: { ...day, clientName, phone, total } };
    saveBookings(nb);
  };

  const monthEntries = useMemo(() => {
    return Object.entries(bookings).filter(([dk]) => {
      const d = new Date(dk+'T12:00:00');
      return d.getFullYear()===currentYear && d.getMonth()===currentMonth;
    });
  }, [bookings, currentMonth, currentYear]);

  const monthRevenue = monthEntries.reduce((sum,[,b]) => sum + (b.payments||[]).reduce((a,p)=>a+p.amount,0), 0);
  const notFullyPaid = monthEntries.filter(([,b]) => {
    const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
    return paid < b.total;
  }).length;

  const grid = getMonthGrid(currentYear, currentMonth);
  const todayKey = toKey(new Date());
  const prevMonth = () => { if(currentMonth===0){setCurrentMonth(11);setCurrentYear(y=>y-1);} else setCurrentMonth(m=>m-1); };
  const nextMonth = () => { if(currentMonth===11){setCurrentMonth(0);setCurrentYear(y=>y+1);} else setCurrentMonth(m=>m+1); };

  const dayClass = (dk) => {
    const b = bookings[dk];
    if(!b) return '';
    const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
    return paid < b.total ? 'pending' : 'booked';
  };

  const HomePage = () => (
    <div className="page active" id="page-home">
      <div className="cards" style={{gridTemplateColumns:'1fr 1fr'}}>
        <div className="card">
          <div className="label">مداخيل حجوزات الشهر</div>
          <div className="value">{fmtM(monthRevenue)} اوقية</div>
          <div className="sub">من {monthEntries.length} حجوزات</div>
        </div>
        <div className="card">
          <div className="label">حجوزات هذا الشهر</div>
          <div className="value">{monthEntries.length}</div>
          <div className="sub">{notFullyPaid} غير مكتملة الدفع</div>
        </div>
      </div>

      <div className="panel">
        <div className="cal-head">
          <h2>{MONTH_NAMES[currentMonth]} {currentYear}</h2>
          <div className="cal-nav">
            <button onClick={prevMonth} aria-label="الشهر السابق">‹</button>
            <button onClick={nextMonth} aria-label="الشهر التالي">›</button>
          </div>
        </div>
        <div className="weekdays">
          <span>أحد</span><span>إثنين</span><span>ثلاثاء</span><span>أربعاء</span><span>خميس</span><span>جمعة</span><span>سبت</span>
        </div>
        <div className="days">
          {grid.map((d, i) => {
            if(!d) return <div className="day empty" key={i}></div>;
            const dk = toKey(d);
            const cls = ['day', dayClass(dk)];
            if(dk === todayKey) cls.push('today');
            return <div className={cls.join(' ').trim()} key={i} onClick={()=>setSelectedDay(dk)}>{d.getDate()}</div>;
          })}
        </div>
        <div className="legend">
          <span><i className="free"></i> متاح</span>
          <span><i className="pending"></i> متبقي مبلغ</span>
          <span><i className="booked"></i> محجوز</span>
        </div>
        <div className="hint-row">اضغط على أي تاريخ لعرض التفاصيل أو إضافة حجز جديد</div>
      </div>
    </div>
  );

  const AgendaPage = () => {
    const [search, setSearch] = useState('');
    const [filter, setFilter] = useState('all');
    const [monthFilter, setMonthFilter] = useState('all');

    const monthKeys = useMemo(() => {
      const keys = new Set(Object.keys(bookings).map(dk => dk.slice(0,7))); // "YYYY-MM"
      return Array.from(keys).sort();
    }, [bookings]);

    const entries = useMemo(() => {
      return Object.entries(bookings)
        .filter(([dk]) => monthFilter === 'all' || dk.slice(0,7) === monthFilter)
        .map(([dk, b]) => {
          const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
          const status = paid < b.total ? 'pending' : 'booked';
          return { dk, ...b, paid, status };
        })
        .filter(b => filter === 'all' || b.status === filter)
        .filter(b => !search.replace(/\s/g,'') || b.phone.replace(/\s/g,'').includes(search.replace(/\s/g,'')))
        .sort((a,b) => a.dk.localeCompare(b.dk));
    }, [bookings, filter, monthFilter, search]);

    return (
      <div className="page active">
        <div className="search-row">
          <div className="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="tel" placeholder="ابحث برقم الهاتف" value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <select className="month-select" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
            <option value="all">كل الأشهر</option>
            {monthKeys.map(mk => {
              const [y,m] = mk.split('-');
              return <option key={mk} value={mk}>{MONTH_NAMES[parseInt(m,10)-1]} {y}</option>;
            })}
          </select>
          <button className="export-icon-btn" aria-label="تصدير الجدول للحارس" onClick={()=>setMonthlyExportScope(monthFilter)}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          </button>
        </div>
        <div className="filter-chips">
          <button className={`chip ${filter==='all'?'active':''}`} onClick={()=>setFilter('all')}>الكل</button>
          <button className={`chip ${filter==='booked'?'active':''}`} onClick={()=>setFilter('booked')}>محجوز</button>
          <button className={`chip ${filter==='pending'?'active':''}`} onClick={()=>setFilter('pending')}>متبقي مبلغ</button>
        </div>
        <div style={{fontSize:'.78rem', color:'var(--ink-muted)', marginBottom:12}}>{entries.length} حجوزات</div>
        <div className="agenda-list">
          {entries.length === 0 && <div className="empty-state">لا توجد نتائج مطابقة</div>}
          {entries.map(b => {
            const d = new Date(b.dk+'T12:00:00');
            return (
              <div className={`agenda-item ${b.status}`} key={b.dk} onClick={()=>setSelectedDay(b.dk)}>
                <div className="agenda-date">
                  <div className="num">{d.getDate()}</div>
                  <div className="mon">{MONTH_NAMES[d.getMonth()]}</div>
                </div>
                <div className="agenda-info">
                  <div className="name">{b.clientName}</div>
                  <div className="meta ltr-nums">{formatPhone(b.phone)}</div>
                </div>
                <div className="agenda-status">{b.status==='pending'?'متبقي مبلغ':'محجوز'}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const EarningsPage = () => {
    const [drilledMonth, setDrilledMonth] = useState(null);

    // Flatten every payment across every booking into one list, tagged with
    // its own real payment date — this is the source of truth for "earnings",
    // completely independent of which month the underlying event falls in.
    const allPayments = useMemo(() => {
      const list = [];
      Object.entries(bookings).forEach(([dk, b]) => {
        (b.payments||[]).forEach(p => {
          list.push({ ...p, bookingDateKey: dk, clientName: b.clientName, phone: b.phone });
        });
      });
      return list;
    }, [bookings]);

    const statsForMonthKey = (mk) => {
      const pays = allPayments.filter(p => (p.date||'').slice(0,7) === mk);
      const total = pays.reduce((s,p)=>s+p.amount, 0);
      return { total, count: pays.length };
    };
    const remainingAcrossAllBookings = useMemo(() => {
      return Object.values(bookings).reduce((s,b)=>{
        const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
        return s + Math.max(0, b.total - paid);
      }, 0);
    }, [bookings]);

    const allMonthKeys = useMemo(() => Array.from(new Set(allPayments.map(p=>(p.date||'').slice(0,7)))).filter(Boolean).sort(), [allPayments]);
    const statsAll = useMemo(() => allMonthKeys.reduce((acc,mk)=>{
      const s = statsForMonthKey(mk);
      acc.total+=s.total; acc.count+=s.count;
      return acc;
    }, {total:0,count:0}), [bookings, allMonthKeys]);

    const shownTotal = drilledMonth ? statsForMonthKey(drilledMonth).total : statsAll.total;
    const shownCount = drilledMonth ? statsForMonthKey(drilledMonth).count : statsAll.count;

    const monthPayments = useMemo(() => {
      if(!drilledMonth) return [];
      return allPayments
        .filter(p => (p.date||'').slice(0,7) === drilledMonth)
        .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    }, [allPayments, drilledMonth]);

    return (
      <div className="page active">
        {!drilledMonth ? (
          <>
            <div className="cards" style={{gridTemplateColumns:'1fr 1fr', marginBottom:18}}>
              <div className="card">
                <div className="label">إجمالي المداخيل</div>
                <div className="value">{fmtM(shownTotal)} اوقية</div>
                <div className="sub">{shownCount} دفعات</div>
              </div>
              <div className="card accent">
                <div className="label">المتبقي من العروبين</div>
                <div className="value">{fmtM(remainingAcrossAllBookings)} اوقية</div>
                <div className="sub">عبر الحجوزات المعلقة</div>
              </div>
            </div>
            <button className="export-earnings-btn" onClick={()=>setEarningsExportScope('all')}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
              تصدير كل السجل PDF
            </button>
            <div className="agenda-list">
              {allMonthKeys.length === 0 && <div className="empty-state">لا توجد بيانات بعد</div>}
              {allMonthKeys.map(mk => {
                const s = statsForMonthKey(mk);
                const [y,m] = mk.split('-');
                return (
                  <div className="month-card" key={mk} onClick={()=>setDrilledMonth(mk)}>
                    <div>
                      <div className="mc-name">{MONTH_NAMES[parseInt(m,10)-1]} {y}</div>
                      <div className="mc-sub">{s.count} دفعات</div>
                    </div>
                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                      <div className="mc-total">{fmtM(s.total)} اوقية</div>
                      <span className="mc-arrow">‹</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        ) : (
          <>
            <div className="month-detail-head">
              <button onClick={()=>setDrilledMonth(null)} aria-label="رجوع">‹</button>
              <h2>{(() => { const [y,m]=drilledMonth.split('-'); return `${MONTH_NAMES[parseInt(m,10)-1]} ${y}`; })()}</h2>
            </div>
            <div className="card" style={{margin:'14px 0'}}>
              <div className="label">إجمالي هذا الشهر</div>
              <div className="value">{fmtM(shownTotal)} اوقية</div>
              <div className="sub">{shownCount} دفعات</div>
            </div>
            <button className="export-earnings-btn" onClick={()=>setEarningsExportScope(drilledMonth)}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
              تصدير بيانات هذا الشهر PDF
            </button>
            <div className="ds-section-title" style={{color:'var(--ink-muted)'}}>الدفعات</div>
            <div className="agenda-list">
              {monthPayments.length === 0 && <div className="empty-state">لا توجد دفعات هذا الشهر</div>}
              {monthPayments.map((p,i) => {
                const d = new Date(p.date+'T12:00:00');
                return (
                  <div className="agenda-item booked" key={p.id||i} onClick={()=>setSelectedDay(p.bookingDateKey)}>
                    <div className="agenda-date">
                      <div className="num">{d.getDate()}</div>
                      <div className="mon">{MONTH_NAMES[d.getMonth()]}</div>
                    </div>
                    <div className="agenda-info">
                      <div className="name">{p.clientName}</div>
                      <div className="meta">{p.method || 'نقدا'} · {p.amount.toLocaleString('en-US')} اوقية</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    );
  };

  const [monthlyExportScope, setMonthlyExportScope] = useState(null); // null | 'all' | 'YYYY-MM'
  const [dailyExportDay, setDailyExportDay] = useState(null); // null | dateKey
  const [receiptView, setReceiptView] = useState(null); // null | {dateKey, paymentIndex}
  const [earningsExportScope, setEarningsExportScope] = useState(null); // null | 'all' | 'YYYY-MM'

  // Each overlay (.overlay/.sheet and .print-overlay) already covers the full
  // screen with position:fixed and its own internal scroll, so the page behind
  // it is never visible or reachable — no extra body-freezing needed. An earlier
  // version froze the body's own position here, which caused real problems on
  // some Android browsers (broken single-finger scrolling, overlays failing to
  // paint their content). Removed for that reason.

  const WEEKDAY_NAMES = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  const MonthlyExportModal = ({ scope, onClose }) => {
    const entries = Object.entries(bookings)
      .filter(([dk]) => scope === 'all' || dk.slice(0,7) === scope)
      .map(([dk,b]) => ({ dk, ...b }))
      .sort((a,b)=>a.dk.localeCompare(b.dk));
    const title = scope === 'all'
      ? 'جدول المناسبات — كل الأشهر'
      : (() => { const [y,m]=scope.split('-'); return `جدول المناسبات — ${MONTH_NAMES[parseInt(m,10)-1]} ${y}`; })();

    return (
      <div className="print-overlay open">
        <div className="print-topbar">
          <button onClick={onClose} aria-label="إغلاق">✕</button>
          <button className="print-btn" onClick={()=>window.print()}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="15" height="15"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
            طباعة / حفظ PDF
          </button>
        </div>
        <div className="doc">
          <div className="doc-header">
            <div className="brand">
              <div className="mark">{badgeLetter}</div>
              <div><h1>{hallName}</h1><div className="sub">{tagline}</div></div>
            </div>
            <div className="meta">{hallPhone}<br/>{hallAddress}</div>
          </div>
          <div className="doc-title"><h2>{title}</h2><p>للمشاركة مع حارس القاعة</p></div>
          <table>
            <thead><tr><th>التاريخ</th><th>الزبون</th><th>الهاتف</th><th>الحالة</th></tr></thead>
            <tbody>
              {entries.map(b => {
                const d = new Date(b.dk+'T12:00:00');
                const paid = (b.payments||[]).reduce((a,p)=>a+p.amount,0);
                const status = paid < b.total ? 'pending' : 'booked';
                return (
                  <tr key={b.dk}>
                    <td>{d.getDate()} {MONTH_NAMES[d.getMonth()]}</td>
                    <td>{b.clientName}</td>
                    <td className="ltr-nums">{formatPhone(b.phone)}</td>
                    <td><span className={`status-pill ${status}`}>{status==='pending'?'متبقي مبلغ':'محجوز'}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="doc-footer">
            <span>تم الإصدار بتاريخ {new Date().toLocaleDateString('en-GB')}</span>
            <span>قاعتي</span>
          </div>
        </div>
      </div>
    );
  };

  const EarningsExportModal = ({ scope, onClose }) => {
    const allPays = [];
    Object.entries(bookings).forEach(([dk, b]) => {
      (b.payments||[]).forEach(p => allPays.push({ ...p, clientName: b.clientName }));
    });
    const filtered = allPays
      .filter(p => scope === 'all' || (p.date||'').slice(0,7) === scope)
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const grandTotal = filtered.reduce((s,p)=>s+p.amount, 0);
    const title = scope === 'all'
      ? 'تقرير الأرباح — كل الأشهر'
      : (() => { const [y,m]=scope.split('-'); return `تقرير الأرباح — ${MONTH_NAMES[parseInt(m,10)-1]} ${y}`; })();

    return (
      <div className="print-overlay open">
        <div className="print-topbar">
          <button onClick={onClose} aria-label="إغلاق">✕</button>
          <button className="print-btn" onClick={()=>window.print()}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="15" height="15"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
            طباعة / حفظ PDF
          </button>
        </div>
        <div className="doc">
          <div className="doc-header">
            <div className="brand">
              <div className="mark">{badgeLetter}</div>
              <div><h1>{hallName}</h1><div className="sub">{tagline}</div></div>
            </div>
            <div className="meta">{hallPhone}<br/>{hallAddress}</div>
          </div>
          <div className="doc-title"><h2>{title}</h2><p>{scope==='all'?'من بداية النشاط إلى اليوم':'هذا الشهر فقط'}</p></div>
          <table>
            <thead><tr><th>التاريخ</th><th>الزبون</th><th>المبلغ المدفوع</th><th>طريقة الدفع</th></tr></thead>
            <tbody>
              {filtered.map((p,i) => {
                const d = new Date(p.date+'T12:00:00');
                return (
                  <tr key={p.id||i}>
                    <td>{d.getDate()} {MONTH_NAMES[d.getMonth()]}</td>
                    <td>{p.clientName}</td>
                    <td>{p.amount.toLocaleString('en-US')} اوقية</td>
                    <td>{p.method || 'نقدا'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{display:'flex', justifyContent:'space-between', padding:'14px 8px', marginTop:6, borderTop:'2px solid #E3E1F2', fontWeight:800}}>
            <span>{scope==='all'?'المجموع الكلي':'مجموع الشهر'}</span><span>{grandTotal.toLocaleString('en-US')} اوقية</span>
          </div>
          <div className="doc-footer">
            <span>تم الإصدار بتاريخ {new Date().toLocaleDateString('en-GB')}</span>
            <span>قاعتي</span>
          </div>
        </div>
      </div>
    );
  };

  const DailyExportModal = ({ dateKey, dayData, onClose }) => {
    const d = new Date(dateKey+'T12:00:00');
    const paid = (dayData.payments||[]).reduce((a,p)=>a+p.amount,0);
    const status = paid < dayData.total ? 'pending' : 'booked';
    return (
      <div className="print-overlay open">
        <div className="print-topbar">
          <button onClick={onClose} aria-label="إغلاق">✕</button>
          <button className="print-btn" onClick={()=>window.print()}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="15" height="15"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
            طباعة / حفظ PDF
          </button>
        </div>
        <div className="doc">
          <div className="doc-header">
            <div className="brand">
              <div className="mark">{badgeLetter}</div>
              <div><h1>{hallName}</h1><div className="sub">{tagline}</div></div>
            </div>
            <div className="meta">{hallPhone}<br/>{hallAddress}</div>
          </div>
          <div className="slip">
            <div className="authorize">تصريح دخول لليوم</div>
            <div className="date-big">{d.getDate()} {MONTH_NAMES[d.getMonth()]} {d.getFullYear()}</div>
            <div className="weekday">{WEEKDAY_NAMES[d.getDay()]}</div>
            <div className="slip-row"><span>الزبون</span><span>{dayData.clientName}</span></div>
            <div className="slip-row"><span>الهاتف</span><span className="ltr-nums">{formatPhone(dayData.phone)}</span></div>
            <div className={`badge-big ${status}`}>{status==='pending'?'متبقي مبلغ':'محجوز'}</div>
            <div className="note">يرجى إبراز هذا التصريح لحارس القاعة عند الوصول يوم المناسبة.</div>
          </div>
        </div>
      </div>
    );
  };

  const ReceiptModal = ({ dateKey, dayData, paymentIndex, onClose }) => {
    const p = (dayData.payments||[])[paymentIndex];
    if(!p) return null;
    const d = new Date(dateKey+'T12:00:00');
    const paidSoFar = (dayData.payments||[]).reduce((a,x)=>a+x.amount,0);
    const remaining = dayData.total - paidSoFar;
    const isFull = remaining <= 0;
    return (
      <div className="print-overlay open">
        <div className="print-topbar">
          <button onClick={onClose} aria-label="إغلاق">✕</button>
          <button className="print-btn" onClick={()=>window.print()}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="15" height="15"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
            طباعة / حفظ PDF
          </button>
        </div>
        <div className="doc">
          <div className="doc-header">
            <div className="brand">
              <div className="mark">{badgeLetter}</div>
              <div><h1>{hallName}</h1><div className="sub">{tagline}</div></div>
            </div>
            <div className="meta">{hallPhone}<br/>{hallAddress}</div>
